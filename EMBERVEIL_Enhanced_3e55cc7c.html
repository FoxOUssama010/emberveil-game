<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    /* =========================================================================
       1. VIEWPORT & PIXEL-ART CANVAS RESET
       Ensures fullscreen 100vw x 100dvh, zero scrolling, and sharp pixels.
       ========================================================================= */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #07050c;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: "Inter", ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #f3efe6;
      direction: ltr;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100dvh;
      background: #07050c;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      cursor: crosshair;
    }

    /* =========================================================================
       2. RESPONSIVE TITLE & CO-OP LOBBY OVERLAYS (MOBILE & DESKTOP FRIENDLY)
       ========================================================================= */
    .overlay-backdrop {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: radial-gradient(circle at center, rgba(16, 12, 30, 0.58) 0%, rgba(6, 4, 12, 0.88) 100%);
      z-index: 20;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .hidden {
      display: none !important;
    }

    .pixel-card {
      width: 100%;
      max-width: 440px;
      max-height: 92dvh;
      overflow-y: auto;
      background: rgba(15, 12, 27, 0.96);
      border: 2px solid #594f82;
      border-radius: 14px;
      padding: 18px 18px 20px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    .game-logo {
      margin: 0 0 4px;
      font-size: clamp(28px, 7vw, 40px);
      font-weight: 800;
      letter-spacing: 3px;
      color: #ff9436;
      text-shadow: 0 3px 0 #38111b, 0 0 22px rgba(255, 136, 51, 0.45);
    }

    .game-subtitle {
      margin: 0 0 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: #78f0ff;
      text-transform: uppercase;
    }

    .feature-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 16px;
    }

    .pill {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(42, 36, 68, 0.85);
      border: 1px solid #4e4575;
      color: #dfd9f5;
    }

    .btn-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      min-height: 46px;
      padding: 11px 16px;
      border-radius: 10px;
      border: 2px solid transparent;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.12s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-solo {
      background: linear-gradient(180deg, #2b8a57 0%, #1d633d 100%);
      border-color: #63ffab;
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(43, 138, 87, 0.4);
    }

    .btn-create {
      background: linear-gradient(180deg, #27689c 0%, #1a4970 100%);
      border-color: #5ceeff;
      color: #ffffff;
    }

    .btn-join {
      background: linear-gradient(180deg, #8c5324 0%, #633917 100%);
      border-color: #ffd452;
      color: #ffffff;
    }

    .btn-secondary {
      background: #25203b;
      border-color: #544b7a;
      color: #d9d3f0;
      min-height: 40px;
      font-size: 13px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .field-group {
      text-align: left;
      margin-bottom: 12px;
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #b4abd6;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .text-input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border-radius: 9px;
      border: 2px solid #584f80;
      background: #0b0914;
      color: #ffffff;
      font-family: ui-monospace, monospace;
      font-size: 16px;
      font-weight: 700;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .text-input:focus {
      border-color: #5ceeff;
    }

    .code-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #0a0812;
      border: 2px dashed #ffd452;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .room-code-text {
      font-family: ui-monospace, monospace;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffd452;
    }

    .copy-btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #ffd452;
      background: #362b14;
      color: #ffe89e;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .color-swatches {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 4px;
    }

    .swatch {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
    }

    .swatch.active {
      border: 3px solid #ffffff;
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .player-list-box {
      background: #0b0914;
      border: 1px solid #3f385e;
      border-radius: 9px;
      padding: 8px 10px;
      margin-bottom: 12px;
      text-align: left;
      font-size: 12px;
    }

    .player-entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .player-entry:last-child {
      border-bottom: none;
    }

    .status-line {
      font-size: 12px;
      color: #78f0ff;
      margin-bottom: 10px;
      min-height: 16px;
    }
  </style>
</head>

  <script>
    "use strict";

    /* =========================================================================
       1. SYNTHESIZED WEBAUDIO SFX & CHIPTUNE AMBIENT MUSIC ENGINE
       ========================================================================= */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.initialized = false;
        this.bgmTimer = 0;
        this.bgmStep = 0;
        this.musicEnabled = true;
        this.musicClock = 0;
      }

      init() {
        if (this.initialized) {
          if (this.ctx && this.ctx.state === "suspended") {
            try { this.ctx.resume(); } catch (_) {}
          }
          return;
        }
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
            if (this.ctx.state === "suspended") this.ctx.resume();
            this.initialized = true;
          }
        } catch (_) {
          this.ctx = null;
        }
      }

      tone(freq, endFreq, duration, wave, vol, delay = 0) {
        if (this.muted || !this.ctx) return;
        try {
          if (this.ctx.state === "suspended") this.ctx.resume();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, now + delay);
          if (endFreq !== freq) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + delay + duration);
          }
          gain.gain.setValueAtTime(vol, now + delay);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + delay + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + delay);
          osc.stop(now + delay + duration + 0.015);
        } catch (_) {}
      }

      play(type) {
        if (this.muted || !this.ctx) return;
        switch (type) {
          case "swing":
            this.tone(330, 95, 0.11, "triangle", 0.13);
            break;
          case "bow":
            this.tone(560, 210, 0.12, "triangle", 0.12);
            this.tone(300, 620, 0.06, "sine", 0.06);
            break;
          case "ember":
            this.tone(520, 130, 0.22, "sawtooth", 0.13);
            this.tone(780, 260, 0.18, "triangle", 0.09);
            break;
          case "hit":
            this.tone(155, 48, 0.12, "square", 0.14);
            break;
          case "gather":
            this.tone(250, 410, 0.08, "triangle", 0.12);
            break;
          case "build":
            this.tone(145, 210, 0.09, "square", 0.11);
            this.tone(290, 430, 0.11, "triangle", 0.10, 0.05);
            break;
          case "craft":
            this.tone(440, 554, 0.09, "triangle", 0.12, 0.00);
            this.tone(554, 659, 0.09, "triangle", 0.12, 0.07);
            this.tone(659, 880, 0.15, "triangle", 0.14, 0.14);
            break;
          case "potion":
            this.tone(370, 554, 0.10, "sine", 0.12, 0.00);
            this.tone(554, 784, 0.14, "sine", 0.13, 0.08);
            break;
          case "chat":
            this.tone(660, 880, 0.08, "sine", 0.10, 0.00);
            this.tone(880, 1046, 0.10, "sine", 0.09, 0.07);
            break;
          case "revive":
            this.tone(330, 440, 0.12, "triangle", 0.14, 0.00);
            this.tone(440, 660, 0.14, "triangle", 0.14, 0.10);
            this.tone(660, 880, 0.22, "triangle", 0.16, 0.20);
            break;
          case "gate":
            this.tone(110, 55, 0.35, "sawtooth", 0.16, 0.00);
            this.tone(330, 660, 0.28, "triangle", 0.13, 0.12);
            break;
          case "roar":
            this.tone(125, 42, 0.46, "sawtooth", 0.20, 0.00);
            break;
          case "hurt":
            this.tone(190, 72, 0.16, "sawtooth", 0.16);
            break;
          case "victory":
            this.tone(523.25, 523.25, 0.14, "triangle", 0.15, 0.00);
            this.tone(659.25, 659.25, 0.14, "triangle", 0.15, 0.13);
            this.tone(783.99, 783.99, 0.14, "triangle", 0.15, 0.26);
            this.tone(1046.5, 1046.5, 0.36, "triangle", 0.18, 0.39);
            break;
          default:
            this.tone(440, 520, 0.06, "sine", 0.08);
        }
      }

      updateMusic(dt, active) {
        if (!active || this.muted || !this.musicEnabled || !this.ctx || this.ctx.state !== "running") return;
        this.bgmTimer -= dt;
        if (this.bgmTimer <= 0) {
          // Original procedural adventure theme: melody, bass pulse and soft chord accents.
          const beat = this.bgmStep % 16;
          const roots = [110, 146.83, 98, 130.81];
          const scale = [0, 3, 5, 7, 10, 7, 5, 3, 0, 5, 7, 12, 10, 7, 5, 3];
          const root = roots[Math.floor(this.bgmStep / 16) % roots.length];
          const melody = root * Math.pow(2, (scale[beat] + 12) / 12);
          this.bgmTimer = 0.25;
          this.tone(melody, melody * 0.995, 0.22, "triangle", 0.024);
          if (beat % 4 === 0) this.tone(root / 2, root / 2, 0.38, "sine", 0.035);
          if (beat % 8 === 0) {
            this.tone(root * 1.5, root * 1.5, 0.52, "sine", 0.010, 0.02);
            this.tone(root * 2, root * 2, 0.42, "sine", 0.008, 0.04);
          }
          if (beat % 4 === 2) this.tone(72, 42, 0.055, "square", 0.009);
          this.bgmStep++;
        }
      }
    }

    const sfx = new SoundEngine();

    /* =========================================================================
       2. CONSTANTS, BIOMES, TILES, RECIPES, BUILD STRUCTURES & QUICK CHAT
       ========================================================================= */
    const TILE_SIZE = 16;
    const WORLD_W = 120;

    const ITEM_DEFS = {

        id: "wood_axe", name: "Wooden Axe", type: "weapon", dmg: 14, range: 23, cooldown: 0.29,

    const RECIPES = [
      { id: "craft_potion",        name: "Health Potion",     desc: "Restores +50 HP",                      cost: { herb: 2, wood: 1 },            action: "potion" },
      { id: "craft_cabin",         name: "Instant 5x5 Cabin", desc: "Builds walls, floor, door, torch & bed", cost: { wood: 24, stone: 6, herb: 4 }, action: "cabin" },
      { id: "craft_axe",           name: "Wooden Axe",        desc: "Chops trees rapidly (14 DMG)",         cost: { wood: 3, stone: 2 },           itemId: "wood_axe" },
      { id: "craft_pick",          name: "Iron Pickaxe",      desc: "Mines ore & crystal fast (16 DMG)",    cost: { iron: 3, wood: 2 },            itemId: "iron_pick" },
      { id: "craft_bow",           name: "Hunter's Bow",      desc: "Ranged arrows (22 DMG)",               cost: { wood: 6, herb: 2 },            itemId: "hunters_bow" },
      { id: "craft_iron_sword",    name: "Iron Broadsword",   desc: "Wide steel slash (29 DMG)",            cost: { iron: 6, wood: 3 },            itemId: "iron_sword" },
      { id: "craft_iron_armor",    name: "Iron Armor",        desc: "150 Max HP + 32% Damage Reduction",    cost: { iron: 8, stone: 4 },           action: "armor" },
      { id: "craft_crystal_blade", name: "Crystal Blade",     desc: "45 DMG + Opens Root Gate!",            cost: { crystal: 6, iron: 4, wood: 2 },itemId: "crystal_blade" },
      { id: "craft_ember_sword",   name: "Ember Greatsword",  desc: "64 DMG + Fires Flaming Waves!",        cost: { ember: 5, coal: 4, crystal: 3 }, itemId: "ember_sword" }

    /* =========================================================================
       3. RESPONSIVE DPR-SAFE PIXEL CANVAS & OFFSCREEN LIGHTING
       ========================================================================= */
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    const lightCanvas = document.createElement("canvas");
    const lightCtx = lightCanvas.getContext("2d");

    let logicalW = 480;
    let logicalH = 280;
    let dpr = 1;
    let isPortrait = false;
    let showTouchControls = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);

    function enforceContextState() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.direction = "ltr";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const rawW = rect.width > 0 ? rect.width : (window.innerWidth || 800);
      const rawH = rect.height > 0 ? rect.height : (window.innerHeight || 600);
      const aspect = Math.max(0.42, Math.min(2.6, rawW / Math.max(1, rawH)));

      isPortrait = rawH > rawW;
      if (isPortrait) {
        logicalW = 320;
        logicalH = Math.max(250, Math.min(620, Math.round(logicalW / aspect)));
      } else {
        logicalH = 280;
        logicalW = Math.max(340, Math.min(680, Math.round(logicalH * aspect)));
      }

      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(logicalW * dpr);
      canvas.height = Math.round(logicalH * dpr);
      lightCanvas.width = logicalW;
      lightCanvas.height = logicalH;
      enforceContextState();
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", resizeCanvas);
    resizeCanvas();

    function clientToLogical(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width > 0 ? rect.width : (window.innerWidth || 1);
      const h = rect.height > 0 ? rect.height : (window.innerHeight || 1);
      return {
        x: ((clientX - rect.left) / w) * logicalW,
        y: ((clientY - rect.top) / h) * logicalH
      };
    }

      const def = DAILY_CHALLENGES[(day - 1) % DAILY_CHALLENGES.length];
      state.challenge = { day, ...def, progress: 0, claimed: false };
    }

    function advanceChallenge(kind, amount = 1) {
      const c = state.challenge;
      if (!c || c.kind !== kind || c.claimed) return;
      c.progress = Math.min(c.target, c.progress + amount);
      if (c.progress >= c.target) {
        c.claimed = true;
        for (const [resource, count] of Object.entries(c.reward)) {
          state.resources[resource] = (state.resources[resource] || 0) + count;
        }
        sfx.play("victory");
        showToast("Challenge complete! Reward delivered.");
      }
    }

    function getBiomeAt(tx, ty) {
      if (tx < 36 && ty >= 22 && ty <= 58) return BIOME.VILLAGE;
      if (tx >= 86) return BIOME.WASTES;
      if (tx >= 56 && ty >= 18) return BIOME.CAVERNS;
      return BIOME.FOREST;
    }

    function generateWorld(seedValue = 133742) {
      state.worldSeed = seedValue;
      state.tiles = Array.from({ length: WORLD_H }, () => new Uint8Array(WORLD_W));
      state.biomes = Array.from({ length: WORLD_H }, () => new Uint8Array(WORLD_W));
      state.nodes = [];
      state.structures.clear();
      state.enemies = [];
      state.projectiles = [];
      state.particles = [];
      state.floatTexts = [];
      state.gateUnlocked = false;
      state.bossDefeated = false;

      let seed = seedValue >>> 0;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };

      for (let y = 0; y < WORLD_H; y++) {
        for (let x = 0; x < WORLD_W; x++) {
          const b = getBiomeAt(x, y);
          state.biomes[y][x] = b;

          if (x === 0 || y === 0 || x === WORLD_W - 1 || y === WORLD_H - 1) {
            state.tiles[y][x] = b === BIOME.WASTES ? TILE.OBSIDIAN_WALL : TILE.CAVERN_WALL;
            continue;
          }

          if (b === BIOME.VILLAGE) state.tiles[y][x] = TILE.GRASS;
          else if (b === BIOME.FOREST) state.tiles[y][x] = TILE.FOREST_GRASS;
          else if (b === BIOME.CAVERNS) state.tiles[y][x] = TILE.CAVERN_FLOOR;
          else state.tiles[y][x] = TILE.ASH_FLOOR;
        }
      }

      const carveRoad = (x0, y0, x1, y1, width = 2) => {
        let cx = x0, cy = y0;
        while (cx !== x1 || cy !== y1) {
          for (let oy = -Math.floor(width / 2); oy <= Math.floor(width / 2); oy++) {
            for (let ox = -Math.floor(width / 2); ox <= Math.floor(width / 2); ox++) {
              const tx = cx + ox, ty = cy + oy;
              if (tx > 1 && ty > 1 && tx < WORLD_W - 2 && ty < WORLD_H - 2) {
                state.tiles[ty][tx] = TILE.PATH;
              }
            }
          }
          if (Math.abs(x1 - cx) > Math.abs(y1 - cy)) cx += Math.sign(x1 - cx);
          else cy += Math.sign(y1 - cy);
        }
      };

      for (let y = 33; y <= 43; y++) {
        for (let x = 13; x <= 23; x++) {
          state.tiles[y][x] = TILE.PATH;
        }
      }
      carveRoad(20, 33, 24, 14, 2);
      carveRoad(23, 38, 62, 44, 2);
      carveRoad(62, 22, 92, 22, 2);

      for (let x = 8; x <= 32; x++) {
        if (x < 19 || x > 22) state.tiles[25][x] = TILE.FENCE;
        if (x < 19 || x > 22) state.tiles[54][x] = TILE.FENCE;
      }
      for (let y = 25; y <= 54; y++) {
        state.tiles[y][8] = TILE.FENCE;
        if (y < 36 || y > 40) state.tiles[y][32] = TILE.FENCE;
      }

      for (let y = 28; y <= 31; y++) {
        for (let x = 25; x <= 29; x++) {
          state.tiles[y][x] = TILE.WATER;
        }
      }

      // Pulse Caverns Boss Sanctum & Root Gate
      for (let y = 35; y <= 55; y++) {
        for (let x = 78; x <= 94; x++) {
          const isBorder = (x === 78 || x === 94 || y === 35 || y === 55);
          if (isBorder) {
            state.tiles[y][x] = (x === 78 && y >= 43 && y <= 45) ? TILE.ROOT_GATE : TILE.CAVERN_WALL;
          } else {
            state.tiles[y][x] = TILE.SANCTUM_FLOOR;
          }
        }
      }

      for (let y = 4; y < WORLD_H - 4; y++) {
        for (let x = 4; x < WORLD_W - 4; x++) {
          const t = state.tiles[y][x];
          const b = state.biomes[y][x];
          if (t === TILE.PATH || t === TILE.SANCTUM_FLOOR || t === TILE.ROOT_GATE) continue;
          if (b === BIOME.CAVERNS && rand() < 0.065) state.tiles[y][x] = TILE.CAVERN_WALL;
          else if (b === BIOME.WASTES) {
            if (rand() < 0.055) state.tiles[y][x] = TILE.OBSIDIAN_WALL;
            else if (rand() < 0.025) state.tiles[y][x] = TILE.LAVA;
          }
        }
      }

      state.nodes.push({
        id: "village_campfire",
        type: NODE_TYPE.CAMPFIRE,
        tx: 18,
        ty: 37,
        hp: 9999,
        maxHp: 9999,
        light: 96
      });

      state.nodes.push({

        tx: 14,
        ty: 33,
        hp: 1,
        maxHp: 1,
        opened: false,
        loot: { wood: 8, stone: 4, herb: 3, potion: 1 },

      });

      state.nodes.push({
        id: "forest_secret_chest",
        type: NODE_TYPE.CHEST,
        tx: 44,
        ty: 9,
        hp: 1,
        maxHp: 1,
        opened: false,
        loot: { wood: 10, iron: 4, crystal: 2, potion: 2 },
        label: "Hidden Forest Stash"
      });

      const isTileClearForNode = (tx, ty) => {
        if (tx < 2 || ty < 2 || tx >= WORLD_W - 2 || ty >= WORLD_H - 2) return false;
        const t = state.tiles[ty][tx];
        if (t !== TILE.GRASS && t !== TILE.FOREST_GRASS && t !== TILE.CAVERN_FLOOR && t !== TILE.ASH_FLOOR) return false;
        if (tx >= 16 && tx <= 30 && ty >= 40 && ty <= 52) return false;
        for (const n of state.nodes) {
          if (Math.abs(n.tx - tx) <= 1 && Math.abs(n.ty - ty) <= 1) return false;
        }
        return true;
      };

      const addResourceNode = (type, tx, ty, hp) => {
        if (!isTileClearForNode(tx, ty)) return;
        state.nodes.push({
          id: `${type}_${tx}_${ty}`,
          type,
          tx,
          ty,
          hp,
          maxHp: hp,
          hitAnim: 0
        });
      };

      addResourceNode(NODE_TYPE.TREE, 11, 28, 30);
      addResourceNode(NODE_TYPE.TREE, 12, 30, 30);
      addResourceNode(NODE_TYPE.TREE, 28, 34, 30);
      addResourceNode(NODE_TYPE.STONE, 10, 44, 36);
      addResourceNode(NODE_TYPE.STONE, 12, 47, 36);
      addResourceNode(NODE_TYPE.HERB, 13, 39, 12);
      addResourceNode(NODE_TYPE.HERB, 25, 39, 12);

      for (let i = 0; i < 420; i++) {
        const tx = 2 + Math.floor(rand() * (WORLD_W - 4));
        const ty = 2 + Math.floor(rand() * (WORLD_H - 4));
        const b = state.biomes[ty][tx];

        if (b === BIOME.VILLAGE) {
          const r = rand();
          if (r < 0.45) addResourceNode(NODE_TYPE.TREE, tx, ty, 30);
          else if (r < 0.75) addResourceNode(NODE_TYPE.HERB, tx, ty, 12);
          else addResourceNode(NODE_TYPE.STONE, tx, ty, 36);
        } else if (b === BIOME.FOREST) {
          const r = rand();
          if (r < 0.56) addResourceNode(NODE_TYPE.TREE, tx, ty, 30);
          else if (r < 0.78) addResourceNode(NODE_TYPE.HERB, tx, ty, 12);
          else addResourceNode(NODE_TYPE.STONE, tx, ty, 36);
        } else if (b === BIOME.CAVERNS) {
          const r = rand();
          if (r < 0.36) addResourceNode(NODE_TYPE.IRON, tx, ty, 45);
          else if (r < 0.66) addResourceNode(NODE_TYPE.CRYSTAL, tx, ty, 50);
          else if (r < 0.84) addResourceNode(NODE_TYPE.STONE, tx, ty, 36);
          else addResourceNode(NODE_TYPE.HERB, tx, ty, 12);
        } else if (b === BIOME.WASTES) {
          const r = rand();
          if (r < 0.44) addResourceNode(NODE_TYPE.COAL, tx, ty, 45);
          else if (r < 0.82) addResourceNode(NODE_TYPE.EMBER, tx, ty, 55);
          else addResourceNode(NODE_TYPE.IRON, tx, ty, 45);
        }
      }

      let enemySeq = 1;
      const spawnEnemy = (kind, tx, ty) => {

          hopper:  { name: "Forest Hopper", hp: 42,  dmg: 10, speed: 46, aggro: 95 },

          stalker: { name: "Ash Stalker",   hp: 95,  dmg: 22, speed: 66, aggro: 120 },
          boss:    { name: "Root Warden",   hp: 420, dmg: 24, speed: 38, aggro: 150, isBoss: true }
        }[kind];

        state.enemies.push({
          id: `en_${enemySeq++}`,

          homeX: tx * TILE_SIZE + 8,
          homeY: ty * TILE_SIZE + 8,
          hp: cfg.hp,
          maxHp: cfg.hp,
          dmg: cfg.dmg,
          speed: cfg.speed,
          aggro: cfg.aggro,
          isBoss: !!cfg.isBoss,
          phase: 1,
          aiTimer: rand() * 2,
          attackTimer: 1.2,
          hitFlash: 0
        });
      };

      for (const [fx, fy] of [[26, 12], [35, 16], [42, 11], [48, 22], [38, 28], [50, 14], [18, 12], [31, 8]]) {
        spawnEnemy("hopper", fx, fy);
      }
      for (const [cx, cy] of [[62, 26], [68, 34], [64, 52], [72, 60], [60, 44], [73, 24], [70, 48]]) {
        spawnEnemy("crawler", cx, cy);
      }
      for (const [wx, wy] of [[94, 14], [104, 20], [98, 34], [108, 46], [96, 58], [106, 64], [92, 26]]) {
        spawnEnemy("stalker", wx, wy);
      }
      spawnEnemy("boss", 87, 44);
    }

    /* =========================================================================
       6. AMONG US STYLE ROOM CODE CO-OP NETWORKING (PEERJS + BROADCASTCHANNEL)
       ========================================================================= */
    class CoopNetwork {
      constructor() {
        this.mode = "solo"; // "solo" | "host" | "guest"
        this.roomCode = "";
        this.peer = null;
        this.conns = new Map(); // peerId -> DataConnection
        this.hostConn = null;
        this.bc = null;
        this.syncTimer = 0;
        this.enemySyncTimer = 0;
        this.roster = new Map(); // playerId -> { id, name, color, isHost }
      }

      generateCode() {
        const num = Math.floor(1000 + Math.random() * 9000);
        return `EMB-${num}`;
      }

      normalizeCode(raw) {
        const clean = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
        if (clean.startsWith("EMB") && clean.length >= 7) {
          return `EMB-${clean.slice(3, 7)}`;
        }
        if (clean.length === 4 && /^\d{4}$/.test(clean)) {
          return `EMB-${clean}`;
        }
        return raw.trim().toUpperCase();
      }

      cleanup() {
        try {
          for (const c of this.conns.values()) c.close();
          if (this.hostConn) this.hostConn.close();
          if (this.peer) this.peer.destroy();
          if (this.bc) this.bc.close();
        } catch (_) {}
        this.conns.clear();
        this.hostConn = null;
        this.peer = null;
        this.bc = null;
        this.roster.clear();
        state.remotePlayers.clear();
      }

      initBroadcastChannel() {
        try {
          if (typeof BroadcastChannel !== "undefined") {
            this.bc = new BroadcastChannel("emberveil_coop_bus_v1");
            this.bc.onmessage = (ev) => {
              const msg = ev.data;
              if (!msg || msg.room !== this.roomCode || msg.sender === state.player.id) return;
              this.handlePacket(msg.packet, msg.sender, true);
            };
          }
        } catch (_) {
          this.bc = null;
        }
      }

      startHost(heroName, heroColor, onStatus, onRosterChange) {
        this.cleanup();
        this.mode = "host";
        this.roomCode = this.generateCode();

        state.player.name = heroName || "HostHero";
        state.player.color = heroColor || HERO_COLORS[0];
        this.roster.set(state.player.id, {
          id: state.player.id,
          name: state.player.name,
          color: state.player.color,
          isHost: true
        });
        if (onRosterChange) onRosterChange();

        this.initBroadcastChannel();

        if (typeof window.Peer !== "undefined") {
          try {
            const peerId = `emberveil-room-${this.roomCode}`;
            this.peer = new window.Peer(peerId);
            this.peer.on("open", () => {
              if (onStatus) onStatus("Online P2P + Local Tab Ready! Share code:");
            });
            this.peer.on("connection", (conn) => {
              this.bindHostConnection(conn, onRosterChange);
            });
            this.peer.on("error", () => {
              if (onStatus) onStatus("Local Tab Co-op Ready (Offline P2P fallback):");
            });
          } catch (_) {
            if (onStatus) onStatus("Local Tab Co-op Ready:");
          }
        } else {
          if (onStatus) onStatus("Room Ready! Share code with friend:");
        }
        return this.roomCode;
      }

      bindHostConnection(conn, onRosterChange) {
        conn.on("open", () => {
          this.conns.set(conn.peer, conn);
          // Send current roster and if already playing, full world snapshot
          conn.send({
            type: "ROSTER_SYNC",
            roster: Array.from(this.roster.values())
          });
          if (state.screen === "playing") {
            conn.send(this.buildWorldSnapshot());
          }
        });
        conn.on("data", (packet) => {
          this.handlePacket(packet, conn.peer, false, onRosterChange);
          // Relay packet to other guests
          for (const [pid, other] of this.conns.entries()) {
            if (pid !== conn.peer && other.open) {
              try { other.send(packet); } catch (_) {}
            }
          }
        });
        conn.on("close", () => {
          this.conns.delete(conn.peer);
          if (conn.heroId) {
            this.roster.delete(conn.heroId);
            state.remotePlayers.delete(conn.heroId);
            this.broadcast({ type: "ROSTER_SYNC", roster: Array.from(this.roster.values()) });
            if (onRosterChange) onRosterChange();
          }
        });
      }

      joinRoom(rawCode, heroName, heroColor, onStatus, onConnected) {
        this.cleanup();
        const code = this.normalizeCode(rawCode);
        if (!code || code.length < 4) {
          if (onStatus) onStatus("Please enter a valid code like EMB-4829.");
          return;
        }
        this.mode = "guest";
        this.roomCode = code;
        state.player.name = heroName || "AllyHero";
        state.player.color = heroColor || HERO_COLORS[1];

        this.initBroadcastChannel();

        // Announce join via BroadcastChannel immediately for same-browser tabs
        this.send({
          type: "HELLO",
          hero: {
            id: state.player.id,
            name: state.player.name,
            color: state.player.color,
            isHost: false
          }
        });

        if (typeof window.Peer !== "undefined") {
          try {
            if (onStatus) onStatus(`Connecting to ${code}...`);
            this.peer = new window.Peer();
            this.peer.on("open", () => {
              const targetPeerId = `emberveil-room-${code}`;
              const conn = this.peer.connect(targetPeerId, { reliable: true });
              this.hostConn = conn;
              conn.on("open", () => {
                if (onStatus) onStatus(`Connected to ${code}! Waiting for Host to start...`);
                conn.send({
                  type: "HELLO",
                  hero: {
                    id: state.player.id,
                    name: state.player.name,
                    color: state.player.color,
                    isHost: false
                  }
                });
                if (onConnected) onConnected();
              });
              conn.on("data", (packet) => {
                this.handlePacket(packet, "host", false);
              });
              conn.on("error", () => {
                if (onStatus) onStatus(`Searching ${code} (check code or same-browser tab)...`);
              });
            });
            this.peer.on("error", () => {
              if (onStatus) onStatus(`Could not reach ${code} via WebRTC; listening on local tab...`);
            });
          } catch (_) {}
        } else {
          if (onStatus) onStatus(`Listening for ${code}...`);
        }
      }

      send(packet) {
        if (this.mode === "solo") return;
        if (this.bc) {
          try {
            this.bc.postMessage({ room: this.roomCode, sender: state.player.id, packet });
          } catch (_) {}
        }
        if (this.mode === "host") {
          for (const conn of this.conns.values()) {
            if (conn.open) {
              try { conn.send(packet); } catch (_) {}
            }
          }
        } else if (this.mode === "guest" && this.hostConn && this.hostConn.open) {
          try { this.hostConn.send(packet); } catch (_) {}
        }
      }

      broadcast(packet) {
        this.send(packet);
      }

      buildWorldSnapshot() {
        return {
          type: "WORLD_INIT",
          seed: state.worldSeed,
          dayTime: state.dayTime,
          dayCount: state.dayCount,
          gateUnlocked: state.gateUnlocked,
          bossDefeated: state.bossDefeated,
          aliveNodeIds: state.nodes.map(n => n.id),
          openedChests: state.nodes.filter(n => n.type === NODE_TYPE.CHEST && n.opened).map(n => n.id),
          structures: Array.from(state.structures.entries()),
          enemies: state.enemies.map(e => ({
            id: e.id, kind: e.kind, x: e.x, y: e.y, hp: e.hp, maxHp: e.maxHp, phase: e.phase
          }))
        };
      }

      applyWorldSnapshot(snap) {
        hideAllOverlays();
        setupFreshPlayer(false);
        generateWorld(snap.seed || 133742);
        state.dayTime = snap.dayTime ?? 0.28;
        state.dayCount = snap.dayCount ?? 1;
        resetDailyChallenge(state.dayCount);
        state.gateUnlocked = !!snap.gateUnlocked;
        state.bossDefeated = !!snap.bossDefeated;

        if (state.gateUnlocked) {
          for (let gy = 43; gy <= 45; gy++) state.tiles[gy][78] = TILE.ROOT_GATE_OPEN;
        }
        if (Array.isArray(snap.aliveNodeIds)) {
          const aliveSet = new Set(snap.aliveNodeIds);
          state.nodes = state.nodes.filter(n => aliveSet.has(n.id));
        }
        if (Array.isArray(snap.openedChests)) {
          const openSet = new Set(snap.openedChests);
          for (const n of state.nodes) {
            if (openSet.has(n.id)) n.opened = true;
          }
        }
        if (Array.isArray(snap.structures)) {
          state.structures = new Map(snap.structures);
        }
        if (Array.isArray(snap.enemies)) {
          const mapE = new Map(snap.enemies.map(e => [e.id, e]));
          state.enemies = state.enemies.filter(e => mapE.has(e.id));
          for (const e of state.enemies) {
            const s = mapE.get(e.id);
            e.x = s.x; e.y = s.y; e.hp = s.hp; e.phase = s.phase;
          }
        }
        // Offset guest slightly so heroes don't overlap on spawn
        state.player.x = 21.5 * TILE_SIZE;
        state.player.y = 41.5 * TILE_SIZE;
        state.screen = "playing";
        showToast(`Joined Co-op Room ${this.roomCode}!`);
      }

      handlePacket(packet, senderPeerId, fromBroadcast, onRosterChange) {
        if (!packet || !packet.type) return;

        switch (packet.type) {
          case "HELLO": {
            const h = packet.hero;
            if (!h) return;
            this.roster.set(h.id, h);
            if (!fromBroadcast && this.conns.has(senderPeerId)) {
              this.conns.get(senderPeerId).heroId = h.id;
            }
            if (this.mode === "host") {
              this.broadcast({ type: "ROSTER_SYNC", roster: Array.from(this.roster.values()) });
              if (state.screen === "playing") {
                this.broadcast(this.buildWorldSnapshot());
              }
            }
            renderLobbyRoster();
            if (onRosterChange) onRosterChange();
            break;
          }
          case "ROSTER_SYNC": {
            this.roster.clear();
            for (const h of packet.roster || []) {
              this.roster.set(h.id, h);
            }
            const joinSt = document.getElementById("joinStatusText");
            if (joinSt && this.mode === "guest") {
              joinSt.textContent = `Connected to ${this.roomCode}! (${this.roster.size} heroes in lobby)`;
            }
            renderLobbyRoster();
            break;
          }
          case "WORLD_INIT": {
            if (this.mode === "guest") {
              this.applyWorldSnapshot(packet);
            }
            break;
          }
          case "PLAYER_STATE": {
            const d = packet.data;
            if (!d || d.id === state.player.id) return;
            let rp = state.remotePlayers.get(d.id);
            if (!rp) {
              rp = { ...d, targetX: d.x, targetY: d.y };
              state.remotePlayers.set(d.id, rp);
              showToast(`${d.name} joined your adventure!`);
            } else {
              rp.name = d.name;
              rp.color = d.color;
              rp.targetX = d.x;
              rp.targetY = d.y;
              rp.dirX = d.dirX;
              rp.dirY = d.dirY;
              rp.walkAnim = d.walkAnim;
              rp.hp = d.hp;
              rp.maxHp = d.maxHp;
              rp.downed = d.downed;
              rp.toolId = d.toolId;
              rp.attackAnim = d.attackAnim;
              rp.hasArmor = d.hasArmor;
              if (d.emoteTimer > 0) {
                rp.emoteText = d.emoteText;
                rp.emoteTimer = d.emoteTimer;
              }
            }
            break;
          }
          case "NODE_UPDATE": {
            if (packet.removed) {
              state.nodes = state.nodes.filter(n => n.id !== packet.nodeId);
            } else if (packet.chestOpened) {
              const c = state.nodes.find(n => n.id === packet.nodeId);
              if (c) c.opened = true;
            }
            break;
          }
          case "STRUCT_UPDATE": {
            if (packet.action === "place" && packet.struct) {
              state.structures.set(keyFor(packet.struct.tx, packet.struct.ty), packet.struct);
              spawnParticles(packet.struct.tx * TILE_SIZE + 8, packet.struct.ty * TILE_SIZE + 8, "#ffd479", 8, 35);
            } else if (packet.action === "remove") {
              state.structures.delete(keyFor(packet.tx, packet.ty));
            }
            break;
          }
          case "GATE_OPEN": {
            if (!state.gateUnlocked) {
              state.gateUnlocked = true;
              for (let gy = 43; gy <= 45; gy++) state.tiles[gy][78] = TILE.ROOT_GATE_OPEN;
              sfx.play("gate");
              showToast("Teammate unlocked the Root Gate!");
            }
            break;
          }
          case "ENEMY_DAMAGE": {
            const en = state.enemies.find(e => e.id === packet.enemyId);
            if (en && en.hp > 0) {
              applyEnemyDamageLocal(en, packet.dmg, packet.kx || 0, packet.ky || 0, false);
            }
            break;
          }
          case "ENEMY_SYNC": {
            if (this.mode === "guest" && Array.isArray(packet.list)) {
              const incoming = new Map(packet.list.map(item => [item.id, item]));
              state.enemies = state.enemies.filter(e => incoming.has(e.id));
              for (const e of state.enemies) {
                const s = incoming.get(e.id);
                e.x += (s.x - e.x) * 0.45;
                e.y += (s.y - e.y) * 0.45;
                e.hp = s.hp;
                e.phase = s.phase;
              }
              if (packet.bossDefeated && !state.bossDefeated) {
                state.bossDefeated = true;
                sfx.play("victory");
                state.screen = "victory";
              }
            }
            break;
          }
          case "PROJECTILE_SPAWN": {
            if (packet.proj) {
              state.projectiles.push({ ...packet.proj, hitIds: new Set() });
            }
            break;
          }
          case "QUICK_CHAT": {
            const rp = state.remotePlayers.get(packet.id);
            if (rp) {
              rp.emoteText = packet.text;
              rp.emoteTimer = 3.8;
              sfx.play("chat");
            }
            break;
          }
          case "REVIVE_TARGET": {
            if (packet.targetId === state.player.id && state.player.downed) {
              state.player.downed = false;
              state.player.hp = Math.round(state.player.maxHp * 0.5);
              state.player.invuln = 2.0;
              sfx.play("revive");
              spawnParticles(state.player.x, state.player.y, "#5eff8c", 18, 48);
              showToast(`${packet.byName} revived you!`);
            }
            break;
          }
        }
      }

      update(dt) {
        if (this.mode === "solo") return;

        // Interpolate remote players smoothly
        for (const rp of state.remotePlayers.values()) {
          rp.x += (rp.targetX - rp.x) * Math.min(1, dt * 16);
          rp.y += (rp.targetY - rp.y) * Math.min(1, dt * 16);
          if (rp.attackAnim > 0) rp.attackAnim = Math.max(0, rp.attackAnim - dt);
          if (rp.emoteTimer > 0) rp.emoteTimer = Math.max(0, rp.emoteTimer - dt);
        }

        // Send local player state at 20 Hz
        this.syncTimer -= dt;
        if (this.syncTimer <= 0) {
          this.syncTimer = 0.05;
          const p = state.player;
          const curSlot = state.hotbar[state.selectedSlot];
          this.send({
            type: "PLAYER_STATE",
            data: {
              id: p.id,
              name: p.name,
              color: p.color,
              x: Math.round(p.x * 10) / 10,
              y: Math.round(p.y * 10) / 10,
              dirX: p.dirX,
              dirY: p.dirY,
              walkAnim: p.walkAnim,
              hp: p.hp,
              maxHp: p.maxHp,
              downed: p.downed,
              toolId: curSlot ? curSlot.id : "wood_axe",
              attackAnim: p.attackAnim,
              hasArmor: p.hasArmor,
              emoteText: p.emoteText,
              emoteTimer: p.emoteTimer
            }
          });
        }

        // Host broadcasts authoritative enemy states every 110ms
        if (this.mode === "host") {
          this.enemySyncTimer -= dt;
          if (this.enemySyncTimer <= 0) {
            this.enemySyncTimer = 0.11;
            this.broadcast({
              type: "ENEMY_SYNC",
              bossDefeated: state.bossDefeated,
              list: state.enemies.map(e => ({
                id: e.id,
                x: Math.round(e.x),
                y: Math.round(e.y),
                hp: e.hp,
                phase: e.phase
              }))
            });
          }
        }
      }
    }

    /* =========================================================================

    const titleOverlay = document.getElementById("titleOverlay");
    const createOverlay = document.getElementById("createOverlay");
    const joinOverlay = document.getElementById("joinOverlay");

    function hideAllOverlays() {
      titleOverlay.classList.add("hidden");
      createOverlay.classList.add("hidden");
      joinOverlay.classList.add("hidden");
    }

    function renderColorSwatches(containerId, initialColor, onPick) {
      const box = document.getElementById(containerId);
      box.innerHTML = "";
      HERO_COLORS.forEach((col) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "swatch" + (col === initialColor ? " active" : "");
        btn.style.background = col;
