    /* =========================================================================
       8. COLLISION & MOVEMENT HELPERS
       ========================================================================= */
    function isTileSolidFor(tx, ty, isPlayer) {
      if (tx < 0 || ty < 0 || tx >= WORLD_W || ty >= WORLD_H) return true;
      const t = state.tiles[ty][tx];
      if (
        t === TILE.CAVERN_WALL ||
        t === TILE.OBSIDIAN_WALL ||
        t === TILE.WATER ||
        t === TILE.LAVA ||
        t === TILE.FENCE ||
        t === TILE.ROOT_GATE
      ) {
        return true;
      }

      const st = state.structures.get(keyFor(tx, ty));
      if (st) {
        if (st.isDoor) return !isPlayer;
        if (st.solid) return true;
      }

      for (const n of state.nodes) {
        if (n.tx === tx && n.ty === ty && n.type !== NODE_TYPE.HERB && n.type !== NODE_TYPE.CAMPFIRE) {
          return true;
        }
      }
      return false;
    }

    function moveWithCollision(ent, dx, dy, halfW, halfH, isPlayer) {
      if (dx !== 0) {
        const nx = ent.x + dx;
        const left = Math.floor((nx - halfW) / TILE_SIZE);
        const right = Math.floor((nx + halfW) / TILE_SIZE);
        const top = Math.floor((ent.y - halfH) / TILE_SIZE);
        const bottom = Math.floor((ent.y + halfH) / TILE_SIZE);
        let blocked = false;
        for (let ty = top; ty <= bottom; ty++) {
          for (let tx = left; tx <= right; tx++) {
            if (isTileSolidFor(tx, ty, isPlayer)) {
              blocked = true;
              break;
            }
          }
          if (blocked) break;
        }
        if (!blocked) ent.x = nx;
      }

      if (dy !== 0) {
        const ny = ent.y + dy;
        const left = Math.floor((ent.x - halfW) / TILE_SIZE);
        const right = Math.floor((ent.x + halfW) / TILE_SIZE);
        const top = Math.floor((ny - halfH) / TILE_SIZE);
        const bottom = Math.floor((ny + halfH) / TILE_SIZE);
        let blocked = false;
        for (let ty = top; ty <= bottom; ty++) {
          for (let tx = left; tx <= right; tx++) {
            if (isTileSolidFor(tx, ty, isPlayer)) {
              blocked = true;
              break;
            }
          }
          if (blocked) break;
        }
        if (!blocked) ent.y = ny;
      }
    }

    function ensurePlayerNotStuck() {
      const p = state.player;
      const ptx = Math.floor(p.x / TILE_SIZE);
      const pty = Math.floor(p.y / TILE_SIZE);
      if (!isTileSolidFor(ptx, pty, true)) return;
      for (let r = 1; r <= 4; r++) {
        for (let dy = -r; dy <= r; dy++) {
          for (let dx = -r; dx <= r; dx++) {
            if (!isTileSolidFor(ptx + dx, pty + dy, true)) {
              p.x = (ptx + dx) * TILE_SIZE + 8;
              p.y = (pty + dy) * TILE_SIZE + 8;
              return;
            }
          }
        }
      }
    }

    /* =========================================================================
       9. COMBAT, GATHERING, CO-OP REVIVE, QUICK CHAT & HOUSE BUILDING
       ========================================================================= */
    function addFloatText(x, y, text, color = "#ffffff") {
      state.floatTexts.push({ x, y, text, color, life: 0.95 });
    }

    function spawnParticles(x, y, color, count = 8, speed = 48) {
      for (let i = 0; i < count; i++) {
        const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.6;
        const spd = speed * (0.45 + Math.random() * 0.75);
        state.particles.push({
          x,
          y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          color,
          size: Math.random() < 0.4 ? 2 : 1,
          life: 0.28 + Math.random() * 0.25
        });
      }
    }

    function hasResources(cost) {
      for (const [res, amt] of Object.entries(cost)) {
        if ((state.resources[res] || 0) < amt) return false;
      }
      return true;
    }

    function spendResources(cost) {
      for (const [res, amt] of Object.entries(cost)) {
        state.resources[res] = Math.max(0, (state.resources[res] || 0) - amt);
      }
    }

    function giveItemToHotbar(itemId, count = 1) {
      if (itemId === "potion") {
        for (let i = 0; i < state.hotbar.length; i++) {
          if (state.hotbar[i] && state.hotbar[i].id === "potion") {
            state.hotbar[i].count += count;
            return;
          }
        }
      }
      for (let i = 0; i < state.hotbar.length; i++) {
        if (state.hotbar[i] && state.hotbar[i].id === itemId) return;
      }
      for (let i = 0; i < state.hotbar.length; i++) {
        if (!state.hotbar[i]) {
          state.hotbar[i] = { id: itemId, count };
          state.selectedSlot = i;
          return;
        }
      }
      const target = state.hotbar[state.selectedSlot]?.id !== "potion" ? state.selectedSlot : 3;
      state.hotbar[target] = { id: itemId, count };
      state.selectedSlot = target;
    }

    function playerHasItem(itemId) {
      return state.hotbar.some(slot => slot && slot.id === itemId);
    }

    function sendQuickChat(text) {
      state.player.emoteText = text;
      state.player.emoteTimer = 3.8;
      state.quickChatOpen = false;
      sfx.play("chat");
      net.send({ type: "QUICK_CHAT", id: state.player.id, text });
    }

    function drinkPotion() {
      const p = state.player;
      if (p.downed) {
        showToast("You are downed! Wait for a teammate to revive you.");
        return;
      }
      if (p.hp >= p.maxHp) {
        showToast("Health is already full!");
        return;
      }
      const idx = state.hotbar.findIndex(s => s && s.id === "potion" && s.count > 0);
      if (idx === -1) {
        showToast("No Health Potions! Craft one with 2 Herb + 1 Wood.");
        return;
      }
      state.hotbar[idx].count -= 1;
      if (state.hotbar[idx].count <= 0) state.hotbar[idx] = null;

      const healed = Math.min(p.maxHp - p.hp, 50);
      p.hp += healed;
      sfx.play("potion");
      spawnParticles(p.x, p.y, "#4fff88", 12, 42);
      addFloatText(p.x, p.y - 10, `+${healed} HP`, "#4fff88");
    }

    function applyEnemyDamageLocal(enemy, dmg, knockX, knockY, broadcastHit = true) {
      enemy.hp -= dmg;
      enemy.hitFlash = 0.14;
      sfx.play("hit");
      state.shake = Math.max(state.shake, enemy.isBoss ? 3.5 : 2.0);
      spawnParticles(enemy.x, enemy.y, "#ff5566", 7, 52);
      addFloatText(enemy.x, enemy.y - 10, `-${dmg}`, "#ffcf4d");

      if (broadcastHit) {
        net.send({ type: "ENEMY_DAMAGE", enemyId: enemy.id, dmg, kx: knockX, ky: knockY });
      }

      if (!enemy.isBoss) {
        moveWithCollision(enemy, knockX * 8, knockY * 8, 5, 5, false);
      }

      if (enemy.hp <= 0) {
        if (!enemy.isBoss) advanceChallenge("slay");
        spawnParticles(enemy.x, enemy.y, "#ff9933", enemy.isBoss ? 28 : 14, 72);
        if (enemy.kind === "hopper") {
          state.resources.herb += 2;
          state.resources.wood += 1;
          addFloatText(enemy.x, enemy.y - 16, "+2 Herb +1 Wood", "#7aff9e");
        } else if (enemy.kind === "crawler") {
          state.resources.iron += 2;
          state.resources.crystal += 1;
          addFloatText(enemy.x, enemy.y - 16, "+2 Iron +1 Crystal", "#78f0ff");
        } else if (enemy.kind === "stalker") {
          state.resources.ember += 2;
          state.resources.coal += 2;
          addFloatText(enemy.x, enemy.y - 16, "+2 Ember +2 Coal", "#ff9e44");
        } else if (enemy.isBoss) {
          state.bossDefeated = true;
          state.resources.ember += 6;
          state.resources.crystal += 6;
          sfx.play("victory");
          state.screen = "victory";
        }
      }
    }

    function harvestNode(node, power) {
      if (node.type === NODE_TYPE.CAMPFIRE) return;
      if (node.type === NODE_TYPE.CHEST) {
        openChest(node);
        return;
      }
      node.hp -= power;
      node.hitAnim = 0.16;
      sfx.play("gather");
      const nx = node.tx * TILE_SIZE + 8;
      const ny = node.ty * TILE_SIZE + 8;

      const colorMap = {
        tree: "#69b856",
        stone: "#9aa5b8",
        herb: "#5eff8c",
        iron: "#f0b47d",
        crystal: "#5ef7ff",
        coal: "#6e6a80",
        ember: "#ff8c2b"
      };
      spawnParticles(nx, ny, colorMap[node.type] || "#fff", 6, 36);

      if (node.hp <= 0) {
        const yieldMap = {
          tree:    { key: "wood",    amt: 3, label: "+3 Wood",    col: "#cfa063" },
          stone:   { key: "stone",   amt: 3, label: "+3 Stone",   col: "#b8c4d9" },
          herb:    { key: "herb",    amt: 2, label: "+2 Herb",    col: "#6bff95" },
          iron:    { key: "iron",    amt: 2, label: "+2 Iron",    col: "#f5ba84" },
          crystal: { key: "crystal", amt: 2, label: "+2 Crystal", col: "#6ef7ff" },
          coal:    { key: "coal",    amt: 2, label: "+2 Coal",    col: "#b8b4c7" },
          ember:   { key: "ember",   amt: 2, label: "+2 Ember",   col: "#ff993b" }
        };
        const yInfo = yieldMap[node.type];
        if (yInfo) {
          advanceChallenge("gather");
          state.resources[yInfo.key] += yInfo.amt;
          addFloatText(nx, ny - 8, yInfo.label, yInfo.col);
        }
        state.nodes = state.nodes.filter(n => n !== node);
        net.send({ type: "NODE_UPDATE", nodeId: node.id, removed: true });
      }
    }

    function openChest(chest) {
      if (chest.opened) {
        showToast("Chest is already empty.");
        return;
      }
      chest.opened = true;
      net.send({ type: "NODE_UPDATE", nodeId: chest.id, chestOpened: true });
      sfx.play("craft");
      const cx = chest.tx * TILE_SIZE + 8;
      const cy = chest.ty * TILE_SIZE + 8;
      spawnParticles(cx, cy, "#ffd43b", 16, 55);

      const parts = [];
      for (const [k, v] of Object.entries(chest.loot)) {
        if (k === "potion") {
          giveItemToHotbar("potion", v);
          parts.push(`+${v} Potion`);
        } else {
          state.resources[k] = (state.resources[k] || 0) + v;
          parts.push(`+${v} ${k[0].toUpperCase() + k.slice(1)}`);
        }
      }
      addFloatText(cx, cy - 10, parts.join(" "), "#ffd43b");
      showToast(`${chest.label}: ${parts.join(", ")}`);
    }

    function performAttack() {
      const p = state.player;
      if (p.downed || p.attackCooldown > 0) return;

      const slot = state.hotbar[state.selectedSlot];
      const item = slot ? ITEM_DEFS[slot.id] : ITEM_DEFS.wood_axe;

      if (item.type === "consumable") {
        drinkPotion();
        return;
      }

      p.attackCooldown = item.cooldown;
      p.attackAnim = 0.18;

      if (item.type === "bow") {
        sfx.play("bow");
        const proj = {
          fromPlayer: true,
          kind: "arrow",
          x: p.x + p.dirX * 8,
          y: p.y + p.dirY * 8,
          vx: p.dirX * 225,
          vy: p.dirY * 225,
          dmg: item.dmg,
          life: 0.78,
          color: "#ffe47a"
        };
        state.projectiles.push(proj);
        net.send({ type: "PROJECTILE_SPAWN", proj });
        return;
      }

      sfx.play(item.shootsWave ? "ember" : "swing");
      if (item.shootsWave) {
        const wave = {
          fromPlayer: true,
          kind: "ember_wave",
          x: p.x + p.dirX * 10,
          y: p.y + p.dirY * 10,
          vx: p.dirX * 175,
          vy: p.dirY * 175,
          dmg: 38,
          life: 0.65,
          pierce: true,
          hitIds: new Set(),
          color: "#ff7722"
        };
        state.projectiles.push(wave);
        net.send({ type: "PROJECTILE_SPAWN", proj: { ...wave, hitIds: undefined } });
      }

      const reach = item.range;
      const hitX = p.x + p.dirX * (reach * 0.65);
      const hitY = p.y + p.dirY * (reach * 0.65);

      for (const e of state.enemies) {
        if (e.hp <= 0) continue;
        const rad = e.isBoss ? 18 : 11;
        if (Math.hypot(e.x - hitX, e.y - hitY) <= reach * 0.75 + rad) {
          applyEnemyDamageLocal(e, item.dmg, p.dirX, p.dirY, true);
        }
      }
      state.enemies = state.enemies.filter(e => e.hp > 0);

      for (const n of [...state.nodes]) {
        const nx = n.tx * TILE_SIZE + 8;
        const ny = n.ty * TILE_SIZE + 8;
        if (Math.hypot(nx - hitX, ny - hitY) <= reach * 0.78 + 8) {
          const mult = n.type === NODE_TYPE.TREE ? (item.chopMult || 1) : (item.mineMult || 1);
          harvestNode(n, Math.round(item.dmg * 0.75 * mult));
          break;
        }
      }
    }

    function performInteract() {
      const p = state.player;
      if (p.downed) return;

      // In Build Mode, USE button places or removes structure at target tile!
      if (state.buildMode) {
        const target = getBuildTargetTile();
        placeOrRemoveStructure(target.tx, target.ty, state.demolishMode);
        return;
      }

      // 1. Co-op Revive Downed Teammate
      for (const rp of state.remotePlayers.values()) {
        if (rp.downed && Math.hypot(rp.x - p.x, rp.y - p.y) <= 28) {
          rp.downed = false;
          rp.hp = Math.round(rp.maxHp * 0.5);
          sfx.play("revive");
          spawnParticles(rp.x, rp.y, "#5eff8c", 18, 48);
          addFloatText(rp.x, rp.y - 12, "REVIVED!", "#5eff8c");
          showToast(`You revived ${rp.name}!`);
          net.send({ type: "REVIVE_TARGET", targetId: rp.id, byName: p.name });
          return;
        }
      }

      const ptx = Math.floor(p.x / TILE_SIZE);
      const pty = Math.floor(p.y / TILE_SIZE);

      // 2. Blacksmith Bran Dialogue
      if (Math.hypot(p.x - state.npc.x, p.y - state.npc.y) <= 26) {
        sfx.play("gather");
        if (!p.talkedToBran) {
          p.talkedToBran = true;
          state.resources.wood += 6;
          state.resources.stone += 4;
          state.dialogueText =
            "Blacksmith Bran: 'Well met, hero! Take these spare planks & stones (+6 Wood, +4 Stone). " +
            "Build a cabin in the South Meadow, then mine Crystals in the East Caverns to forge a Crystal Blade and break the Root Gate!'";
        } else if (!state.gateUnlocked) {
          state.dialogueText =
            "Blacksmith Bran: 'Forge a Crystal Blade (6 Crystal, 4 Iron, 2 Wood) in the Crafting menu [C] to unlock the Root Gate in Pulse Caverns!'";
        } else {
          state.dialogueText =
            "Blacksmith Bran: 'The Root Gate is open! Gather Ember Shards from the Eastern Wastes to forge the Ember Greatsword!'";
        }
        state.modal = "dialogue";
        return;
      }

      // 3. Unlock Pulse Caverns Root Gate
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          const tx = ptx + dx, ty = pty + dy;
          if (tx >= 0 && ty >= 0 && tx < WORLD_W && ty < WORLD_H && state.tiles[ty][tx] === TILE.ROOT_GATE) {
            if (playerHasItem("crystal_blade") || playerHasItem("ember_sword")) {
              for (let gy = 43; gy <= 45; gy++) {
                state.tiles[gy][78] = TILE.ROOT_GATE_OPEN;
                spawnParticles(78 * TILE_SIZE + 8, gy * TILE_SIZE + 8, "#4ff2ff", 14, 55);
              }
              state.gateUnlocked = true;
              sfx.play("gate");
              state.shake = 4;
              net.send({ type: "GATE_OPEN" });
              showToast("The Crystal Blade shatters the Root Gate! Beware the Root Warden!");
            } else {
              showToast("Locked Root Gate! Forge a Crystal Blade to break the seal.");
            }
            return;
          }
        }
      }

      // 4. Rest at a Placed Healing Bed
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          const st = state.structures.get(keyFor(ptx + dx, pty + dy));
          if (st && st.isBed) {
            p.spawnX = (ptx + dx) * TILE_SIZE + 8;
            p.spawnY = (pty + dy) * TILE_SIZE + 8;
            p.hp = p.maxHp;
            p.stamina = p.maxStamina;
            state.dayTime = 0.26;
            state.dayCount += 1;
            sfx.play("potion");
            spawnParticles(p.x, p.y, "#7affb2", 18, 45);
            showToast(`Rested until Morning (Day ${state.dayCount})! Spawn set & HP restored.`);
            return;
          }
        }
      }

      // 5. Open Chests or Gather Nearby Resource Node
      for (const n of [...state.nodes]) {
        const nx = n.tx * TILE_SIZE + 8;
        const ny = n.ty * TILE_SIZE + 8;
        if (Math.hypot(nx - p.x, ny - p.y) <= 26) {
          if (n.type === NODE_TYPE.CHEST) {
            openChest(n);
            return;
          } else if (n.type !== NODE_TYPE.CAMPFIRE) {
            performAttack();
            return;
          }
        }
      }

      showToast("Nothing to interact with here.");
    }

    /* =========================================================================
       10. HOUSE BUILDING, DEMOLISHING & INSTANT 5x5 CABIN BLUEPRINT
       ========================================================================= */
    function getBuildTargetTile() {
      const p = state.player;
      let tx, ty;
      if (state.pointerWorld.active) {
        tx = Math.floor(state.pointerWorld.x / TILE_SIZE);
        ty = Math.floor(state.pointerWorld.y / TILE_SIZE);
        const ptx = Math.floor(p.x / TILE_SIZE);
        const pty = Math.floor(p.y / TILE_SIZE);
        tx = Math.max(ptx - 5, Math.min(ptx + 5, tx));
        ty = Math.max(pty - 5, Math.min(pty + 5, ty));
      } else {
        tx = Math.floor((p.x + p.dirX * 18) / TILE_SIZE);
        ty = Math.floor((p.y + p.dirY * 18) / TILE_SIZE);
      }
      return { tx, ty };
    }

    function canPlaceStructureAt(tx, ty, def) {
      if (tx < 2 || ty < 2 || tx >= WORLD_W - 2 || ty >= WORLD_H - 2) return false;
      const t = state.tiles[ty][tx];
      if (
        t === TILE.CAVERN_WALL ||
        t === TILE.OBSIDIAN_WALL ||
        t === TILE.WATER ||
        t === TILE.LAVA ||
        t === TILE.FENCE ||
        t === TILE.ROOT_GATE ||
        t === TILE.ROOT_GATE_OPEN
      ) {
        return false;
      }

      if (Math.hypot(tx * TILE_SIZE + 8 - state.npc.x, ty * TILE_SIZE + 8 - state.npc.y) < 16) return false;
      for (const n of state.nodes) {
        if (n.tx === tx && n.ty === ty) return false;
      }

      const existing = state.structures.get(keyFor(tx, ty));
      if (existing) {
        if (existing.id === "floor" && (def.id === "torch" || def.id === "bed" || def.id === "campfire")) {
          return true;
        }
        return false;
      }
      return true;
    }

    function placeOrRemoveStructure(tx, ty, forceRemove = false) {
      const k = keyFor(tx, ty);
      const existing = state.structures.get(k);

      if (forceRemove || state.demolishMode) {
        if (!existing) {
          showToast("No player structure on that tile.");
          return;
        }
        for (const [res, amt] of Object.entries(existing.cost)) {
          state.resources[res] = (state.resources[res] || 0) + Math.ceil(amt * 0.5);
        }
        state.structures.delete(k);
        net.send({ type: "STRUCT_UPDATE", action: "remove", tx, ty });
        sfx.play("build");
        spawnParticles(tx * TILE_SIZE + 8, ty * TILE_SIZE + 8, "#d4a373", 8, 35);
        showToast(`Removed ${existing.name} (materials refunded).`);
        return;
      }

      const def = BUILD_DEFS[state.selectedBuildIdx];
      if (!canPlaceStructureAt(tx, ty, def)) {
        showToast("Cannot build on this tile!");
        return;
      }
      if (!hasResources(def.cost)) {
        showToast(`Need more resources for ${def.name}!`);
        return;
      }

      spendResources(def.cost);
      const structObj = {
        ...def,
        tx,
        ty,
        curHp: def.hp,
        fireCooldown: 0
      };
      state.structures.set(k, structObj);
      advanceChallenge("build");
      net.send({ type: "STRUCT_UPDATE", action: "place", struct: structObj });

      if (def.isBed) {
        state.player.spawnX = tx * TILE_SIZE + 8;
        state.player.spawnY = ty * TILE_SIZE + 8;
        showToast("Healing Bed placed! Respawn point updated.");
      }

      sfx.play("build");
      spawnParticles(tx * TILE_SIZE + 8, ty * TILE_SIZE + 8, "#ffd479", 10, 40);
      ensurePlayerNotStuck();
    }

    function buildInstantCabin() {
      const p = state.player;
      const baseTx = Math.floor(p.x / TILE_SIZE);
      const baseTy = Math.floor(p.y / TILE_SIZE);

      const offsets = [
        [0, -1], [0, 0], [-2, -2], [2, -2], [-2, 2], [2, 2], [0, -3], [0, 3], [-3, 0], [3, 0]
      ];
      let bestCx = null, bestCy = null;

      for (const [ox, oy] of offsets) {
        const cx = baseTx + ox;
        const cy = baseTy + oy;
        let ok = true;
        for (let dy = -2; dy <= 2; dy++) {
          for (let dx = -2; dx <= 2; dx++) {
            const tx = cx + dx, ty = cy + dy;
            if (tx < 3 || ty < 3 || tx >= WORLD_W - 3 || ty >= WORLD_H - 3) ok = false;
            const t = state.tiles[ty][tx];
            if (t === TILE.CAVERN_WALL || t === TILE.OBSIDIAN_WALL || t === TILE.WATER || t === TILE.LAVA || t === TILE.FENCE || t === TILE.ROOT_GATE) ok = false;
            if (state.structures.has(keyFor(tx, ty))) ok = false;
            for (const n of state.nodes) {
              if (n.tx === tx && n.ty === ty) ok = false;
            }
          }
        }
        if (ok) {
          bestCx = cx;
          bestCy = cy;
          break;
        }
      }

      if (bestCx === null) {
        showToast("Move to a clearer 5x5 patch of land to build the Cabin!");
        return false;
      }

      const floorDef = BUILD_DEFS.find(b => b.id === "floor");
      const wallDef  = BUILD_DEFS.find(b => b.id === "wwall");
      const doorDef  = BUILD_DEFS.find(b => b.id === "door");
      const torchDef = BUILD_DEFS.find(b => b.id === "torch");
      const bedDef   = BUILD_DEFS.find(b => b.id === "bed");

      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          const tx = bestCx + dx;
          const ty = bestCy + dy;
          const isEdge = Math.abs(dx) === 2 || Math.abs(dy) === 2;
          const isDoor = dx === 0 && dy === 2;

          let piece = floorDef;
          if (isDoor) piece = doorDef;
          else if (isEdge) piece = wallDef;
          else if (dx === -1 && dy === -1) piece = bedDef;
          else if (dx === 1 && dy === -1) piece = torchDef;

          const structObj = {
            ...piece,
            tx,
            ty,
            curHp: piece.hp,
            fireCooldown: 0
          };
          state.structures.set(keyFor(tx, ty), structObj);
          net.send({ type: "STRUCT_UPDATE", action: "place", struct: structObj });
        }
      }

      p.x = bestCx * TILE_SIZE + 8;
      p.y = bestCy * TILE_SIZE + 8;
      p.spawnX = (bestCx - 1) * TILE_SIZE + 8;
      p.spawnY = (bestCy - 1) * TILE_SIZE + 8;

      sfx.play("craft");
      spawnParticles(p.x, p.y, "#ffd43b", 26, 70);
      showToast("5x5 Furnished Cabin built! Spawn point set to your new Bed.");
      return true;
    }

    function executeCraft(recipe) {
      if (!hasResources(recipe.cost)) {
        showToast("Not enough materials!");
        return;
      }

      if (recipe.action === "cabin") {
        spendResources(recipe.cost);
        const built = buildInstantCabin();
        if (!built) {
          for (const [k, v] of Object.entries(recipe.cost)) state.resources[k] += v;
          return;
        }
        state.modal = null;
        return;
      }

      if (recipe.action === "armor") {
        if (state.player.hasArmor) {
          showToast("You are already wearing Iron Armor!");
          return;
        }
        spendResources(recipe.cost);
        state.player.hasArmor = true;
        state.player.maxHp = 150;
        state.player.hp = 150;
        sfx.play("craft");
        spawnParticles(state.player.x, state.player.y, "#78f0ff", 16, 50);
        showToast("Iron Armor equipped! Max HP increased to 150.");
        return;
      }

      if (recipe.action === "potion") {
        spendResources(recipe.cost);
        giveItemToHotbar("potion", 1);
        sfx.play("craft");
        showToast("Crafted Health Potion!");
        return;
      }

      if (recipe.itemId) {
        if (playerHasItem(recipe.itemId)) {
          showToast("You already carry this item!");
          return;
        }
        spendResources(recipe.cost);
        giveItemToHotbar(recipe.itemId, 1);
        sfx.play("craft");
        showToast(`Forged ${recipe.name}!`);
      }
    }

    /* =========================================================================
       11. UNIFIED KEYBOARD, MOUSE & MOBILE VIRTUAL JOYSTICK / BUTTON INPUTS
       ========================================================================= */
    const keys = {};
    const joy = {
      active: false,
      pointerId: null,
      baseX: 54,
      baseY: 220,
      knobX: 54,
      knobY: 220,
      dx: 0,
      dy: 0
    };

    function getTouchButtons() {
      const m = 10;
      const bw = 38;
      const bh = 28;
      const rightX = logicalW - m - bw;
      const leftBtnX = rightX - bw - 6;
      const botY = logicalH - m - bh;
      const midY = botY - bh - 6;
      const topY = midY - bh - 6;

      return [
        { id: "atk",   label: "ATK",   x: rightX,   y: botY, w: bw, h: bh, bg: "rgba(175, 45, 58, 0.85)",  border: "#ff8592" },
        { id: "use",   label: "USE",   x: leftBtnX, y: botY, w: bw, h: bh, bg: "rgba(38, 125, 86, 0.85)",  border: "#6effb8" },
        { id: "build", label: "BUILD", x: rightX,   y: midY, w: bw, h: bh, bg: "rgba(165, 108, 32, 0.85)", border: "#ffd452" },
        { id: "heal",  label: "HEAL",  x: leftBtnX, y: midY, w: bw, h: bh, bg: "rgba(145, 42, 118, 0.85)", border: "#ff8ce0" },
        { id: "craft", label: "CRAFT", x: rightX,   y: topY, w: bw, h: bh, bg: "rgba(42, 95, 165, 0.85)",  border: "#78c2ff" },
        { id: "chat",  label: "CHAT",  x: leftBtnX, y: topY, w: bw, h: bh, bg: "rgba(88, 64, 156, 0.85)",  border: "#cbb5ff" }
      ];
    }

    function getTopBarPills() {
      const y = 41;
      return [
        { id: "mute",  label: sfx.muted ? "MUTE" : "SFX", x: 6,   y, w: 30, h: 14 },
        { id: "touch", label: showTouchControls ? "PAD:ON" : "PAD:OFF", x: 39, y, w: 42, h: 14 },
        { id: "save",  label: "SAVE", x: 84,  y, w: 30, h: 14 },
        { id: "pause", label: "||",   x: 117, y, w: 18, h: 14 },
        { id: "music", label: sfx.musicEnabled ? "MUS:ON" : "MUS:OFF", x: 138, y, w: 42, h: 14 }
      ];
    }

    function getHotbarRects() {
      const slotSize = 21;
      const gap = 3;
      const totalW = 5 * slotSize + 4 * gap;
      const startX = Math.floor((logicalW - totalW) / 2);
      const startY = logicalH - slotSize - 6;
      const rects = [];
      for (let i = 0; i < 5; i++) {
        rects.push({ index: i, x: startX + i * (slotSize + gap), y: startY, w: slotSize, h: slotSize });
      }
      return rects;
    }

    function getBuildPaletteRects() {
      const items = [...BUILD_DEFS, { id: "demolish", short: "DEL" }];
      const cellW = 28;
      const cellH = 18;
      const gap = 2;
      const totalW = items.length * cellW + (items.length - 1) * gap;
      const startX = Math.max(4, Math.floor((logicalW - totalW) / 2));
      const startY = logicalH - 50;
      return items.map((item, idx) => ({
        item,
        idx,
        x: startX + idx * (cellW + gap),
        y: startY,
        w: cellW,
        h: cellH
      }));
    }

    function getMinimapRect() {
      const mw = 64;
      const mh = 42;
      return { x: logicalW - mw - 6, y: 6, w: mw, h: mh };
    }

    function getCraftingCardRects() {
      const boxW = Math.min(logicalW - 16, 330);
      const boxH = Math.min(logicalH - 16, 250);
      const bx = Math.floor((logicalW - boxW) / 2);
      const by = Math.floor((logicalH - boxH) / 2);
      const headerH = 22;
      const footerH = 16;
      const availH = boxH - headerH - footerH;
      const rowH = Math.max(18, Math.floor(availH / RECIPES.length));
      const rows = RECIPES.map((rec, i) => ({
        recipe: rec,
        x: bx + 8,
        y: by + headerH + i * rowH,
        w: boxW - 16,
        h: rowH - 2
      }));
      return { bx, by, boxW, boxH, rows };
    }

    function getQuickChatRects() {
      const cols = 3;
      const btnW = 68;
      const btnH = 18;
      const gap = 4;
      const totalW = cols * btnW + (cols - 1) * gap;
      const startX = Math.floor((logicalW - totalW) / 2);
      const startY = logicalH - 76;
      return QUICK_CHATS.map((text, idx) => ({
        text,
        x: startX + (idx % cols) * (btnW + gap),
        y: startY + Math.floor(idx / cols) * (btnH + gap),
        w: btnW,
        h: btnH
      }));
    }

    function pointInRect(px, py, r) {
      return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
    }

    function respawnLocalPlayer() {
      const p = state.player;
      p.downed = false;
      p.hp = p.maxHp;
      p.stamina = p.maxStamina;
      p.x = p.spawnX;
      p.y = p.spawnY;
      p.invuln = 1.6;
      state.screen = "playing";
    }

    function handleCanvasTap(lx, ly, button = 0) {
      sfx.init();

      if (state.screen === "gameover") {
        respawnLocalPlayer();
        return;
      }

      if (state.screen === "victory") {
        state.screen = "playing";
        return;
      }

      if (state.screen !== "playing") return;

      if (state.modal === "dialogue") {
        state.modal = null;
        return;
      }

      if (state.modal === "map") {
        state.modal = null;
        return;
      }

      if (state.modal === "pause") {
        const bw = 150, bh = 22;
        const bx = Math.floor((logicalW - bw) / 2);
        const by = Math.floor(logicalH / 2) - 24;
        if (pointInRect(lx, ly, { x: bx, y: by, w: bw, h: bh })) {
          state.modal = null;
        } else if (pointInRect(lx, ly, { x: bx, y: by + 28, w: bw, h: bh })) {
          saveGame();
          state.modal = null;
        } else if (pointInRect(lx, ly, { x: bx, y: by + 56, w: bw, h: bh })) {
          net.cleanup();
          state.modal = null;
          state.screen = "title";
          titleOverlay.classList.remove("hidden");
        }
        return;
      }

      if (state.modal === "crafting") {
        const { bx, by, boxW, boxH, rows } = getCraftingCardRects();
        if (!pointInRect(lx, ly, { x: bx, y: by, w: boxW, h: boxH })) {
          state.modal = null;
          return;
        }
        for (const r of rows) {
          if (pointInRect(lx, ly, r)) {
            executeCraft(r.recipe);
            return;
          }
        }
        return;
      }

      // Quick Chat Popup
      if (state.quickChatOpen) {
        for (const q of getQuickChatRects()) {
          if (pointInRect(lx, ly, q)) {
            sendQuickChat(q.text);
            return;
          }
        }
        state.quickChatOpen = false;
      }

      // Top Utility Pills
      for (const pill of getTopBarPills()) {
        if (pointInRect(lx, ly, pill)) {
          if (pill.id === "mute") {
            sfx.muted = !sfx.muted;
            showToast(sfx.muted ? "Audio Muted" : "Audio Unmuted");
          } else if (pill.id === "touch") {
            showTouchControls = !showTouchControls;
          } else if (pill.id === "save") {
            saveGame();
          } else if (pill.id === "pause") {
            state.modal = "pause";
          } else if (pill.id === "music") {
            sfx.musicEnabled = !sfx.musicEnabled;
            showToast(sfx.musicEnabled ? "Adventure music on" : "Music off");
          }
          return;
        }
      }

      // Minimap tap -> Full World Map
      if (pointInRect(lx, ly, getMinimapRect())) {
        state.modal = "map";
        return;
      }

      // Hotbar tap
      for (const slotRect of getHotbarRects()) {
        if (pointInRect(lx, ly, slotRect)) {
          state.selectedSlot = slotRect.index;
          state.buildMode = false;
          return;
        }
      }

      // Build Palette tap
      if (state.buildMode) {
        for (const bRect of getBuildPaletteRects()) {
          if (pointInRect(lx, ly, bRect)) {
            if (bRect.item.id === "demolish") {
              state.demolishMode = !state.demolishMode;
            } else {
              state.demolishMode = false;
              state.selectedBuildIdx = bRect.idx;
            }
            return;
          }
        }
      }

      // Touch Buttons
      if (showTouchControls) {
        for (const btn of getTouchButtons()) {
          if (pointInRect(lx, ly, btn)) {
            if (btn.id === "atk") performAttack();
            else if (btn.id === "use") performInteract();
            else if (btn.id === "heal") drinkPotion();
            else if (btn.id === "build") {
              state.buildMode = !state.buildMode;
              state.demolishMode = false;
            } else if (btn.id === "craft") {
              state.buildMode = false;
              state.modal = "crafting";
            } else if (btn.id === "chat") {
              state.quickChatOpen = !state.quickChatOpen;
            }
            return;
          }
        }
      }

      // World tap / click
      const wx = lx + state.camera.x;
      const wy = ly + state.camera.y;
      state.pointerWorld = { x: wx, y: wy, active: true };

      const p = state.player;
      const ang = Math.atan2(wy - p.y, wx - p.x);
      p.dirX = Math.cos(ang);
      p.dirY = Math.sin(ang);

      if (state.buildMode) {
        const target = getBuildTargetTile();
        placeOrRemoveStructure(target.tx, target.ty, button === 2 || state.demolishMode);
        return;
      }

      if (button === 2) {
        performInteract();
      } else {
        performAttack();
      }
    }

    canvas.addEventListener("contextmenu", (e) => e.preventDefault());

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      sfx.init();
      const pt = clientToLogical(e.clientX, e.clientY);

      if (
        state.screen === "playing" &&
        !state.modal &&
        showTouchControls &&
        e.pointerType === "touch" &&
        pt.x < logicalW * 0.42 &&
        pt.y > logicalH * 0.42 &&
        !joy.active
      ) {
        joy.active = true;
        joy.pointerId = e.pointerId;
        joy.baseX = Math.max(36, Math.min(logicalW * 0.34, pt.x));
        joy.baseY = Math.max(logicalH * 0.52, Math.min(logicalH - 36, pt.y));
        joy.knobX = joy.baseX;
        joy.knobY = joy.baseY;
        joy.dx = 0;
        joy.dy = 0;
        return;
      }

      handleCanvasTap(pt.x, pt.y, e.button);
    });

    canvas.addEventListener("pointermove", (e) => {
      const pt = clientToLogical(e.clientX, e.clientY);
      if (state.screen === "playing") {
        state.pointerWorld.x = pt.x + state.camera.x;
        state.pointerWorld.y = pt.y + state.camera.y;
        state.pointerWorld.active = true;
      }

      if (joy.active && e.pointerId === joy.pointerId) {
        const maxR = 24;
        const vx = pt.x - joy.baseX;
        const vy = pt.y - joy.baseY;
        const dist = Math.hypot(vx, vy);
        if (dist > maxR) {
          joy.knobX = joy.baseX + (vx / dist) * maxR;
          joy.knobY = joy.baseY + (vy / dist) * maxR;
        } else {
          joy.knobX = pt.x;
          joy.knobY = pt.y;
        }
        joy.dx = dist > 3 ? (joy.knobX - joy.baseX) / maxR : 0;
        joy.dy = dist > 3 ? (joy.knobY - joy.baseY) / maxR : 0;
      }
    });

    const releaseJoy = (e) => {
      if (joy.active && e.pointerId === joy.pointerId) {
        joy.active = false;
        joy.pointerId = null;
        joy.dx = 0;
        joy.dy = 0;
      }
    };
    canvas.addEventListener("pointerup", releaseJoy);
    canvas.addEventListener("pointercancel", releaseJoy);

    window.addEventListener("keydown", (e) => {
      if (document.activeElement && (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA")) {
        return;
      }
      const code = e.code;
      keys[code] = true;

      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(code)) {
        e.preventDefault();
      }

      sfx.init();

      if (state.screen === "gameover") {
        if (code === "KeyR" || code === "Space" || code === "Enter") respawnLocalPlayer();
        return;
      }
      if (state.screen === "victory") {
        if (code === "Escape" || code === "Space" || code === "Enter") state.screen = "playing";
        return;
      }
      if (state.screen !== "playing") return;

      if (code === "Escape") {
        if (state.modal) state.modal = null;
        else if (state.quickChatOpen) state.quickChatOpen = false;
        else if (state.buildMode) state.buildMode = false;
        else state.modal = "pause";
        return;
      }

      if (code === "KeyC") {
        state.buildMode = false;
        state.modal = state.modal === "crafting" ? null : "crafting";
        return;
      }
      if (code === "KeyM") {
        state.modal = state.modal === "map" ? null : "map";
        return;
      }
      if (code === "KeyT") {
        state.quickChatOpen = !state.quickChatOpen;
        return;
      }
      if (code === "KeyN") {
        sfx.musicEnabled = !sfx.musicEnabled;
        showToast(sfx.musicEnabled ? "Adventure music on" : "Music off");
        return;
      }

      if (state.modal) {
        if (state.modal === "dialogue" && (code === "Space" || code === "KeyE" || code === "Enter")) {
          state.modal = null;
        }
        return;
      }

      if (code === "KeyB") {
        state.buildMode = !state.buildMode;
        state.demolishMode = false;
      } else if (code === "KeyX" && state.buildMode) {
        state.demolishMode = !state.demolishMode;
      } else if (code === "Space") {
        performAttack();
      } else if (code === "KeyE") {
        performInteract();
      } else if (code === "KeyQ") {
        drinkPotion();
      } else if (code === "F5") {
        e.preventDefault();
        saveGame();
      } else if (code === "Digit1") { state.selectedSlot = 0; state.buildMode = false; }
      else if (code === "Digit2") { state.selectedSlot = 1; state.buildMode = false; }
      else if (code === "Digit3") { state.selectedSlot = 2; state.buildMode = false; }
      else if (code === "Digit4") { state.selectedSlot = 3; state.buildMode = false; }
      else if (code === "Digit5") { state.selectedSlot = 4; state.buildMode = false; }
    });

    window.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    /* =========================================================================
       12. MAIN SIMULATION LOOP (PLAYER, CO-OP SYNC, TURRETS, ENEMIES, BOSS)
       ========================================================================= */
    function damagePlayer(amount) {
      const p = state.player;
      if (p.invuln > 0 || p.downed) return;
      const mitigated = p.hasArmor ? Math.max(1, Math.round(amount * 0.68)) : amount;
      p.hp = Math.max(0, p.hp - mitigated);
      p.invuln = 0.72;
      state.shake = Math.max(state.shake, 3.0);
      sfx.play("hurt");
      spawnParticles(p.x, p.y, "#ff3b5c", 10, 46);
      addFloatText(p.x, p.y - 10, `-${mitigated}`, "#ff4d6d");

      if (p.hp <= 0) {
        // Check if a co-op teammate is alive!
        const aliveAlly = Array.from(state.remotePlayers.values()).some(rp => !rp.downed && rp.hp > 0);
        if (net.mode !== "solo" && aliveAlly) {
          p.downed = true;
          showToast("You are DOWNED! Teammate can revive you with USE.");
          sendQuickChat("Help!");
        } else {
          state.screen = "gameover";
        }
      }
    }

    function updateSimulation(dt) {
      sfx.updateMusic(dt, state.screen === "playing");

      if (state.toastTimer > 0) state.toastTimer = Math.max(0, state.toastTimer - dt);
      if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 18);

      if (state.screen !== "playing") {
        state.dayTime = (state.dayTime + dt * 0.008) % 1;
        return;
      }

      net.update(dt);

      if (state.modal) return;

      // Day/Night cycle
      state.dayTime += dt * 0.0042;
      if (state.dayTime >= 1) {
        state.dayTime -= 1;
        state.dayCount += 1;
        resetDailyChallenge(state.dayCount);
        showToast(`Dawn of Day ${state.dayCount} — new challenge!`);
      }

      const p = state.player;
      if (p.attackCooldown > 0) p.attackCooldown = Math.max(0, p.attackCooldown - dt);
      if (p.attackAnim > 0) p.attackAnim = Math.max(0, p.attackAnim - dt);
      if (p.invuln > 0) p.invuln = Math.max(0, p.invuln - dt);
      if (p.emoteTimer > 0) p.emoteTimer = Math.max(0, p.emoteTimer - dt);

      // Movement vector
      let mx = 0, my = 0;
      if (!p.downed) {
        if (keys["KeyW"] || keys["ArrowUp"]) my -= 1;
        if (keys["KeyS"] || keys["ArrowDown"]) my += 1;
        if (keys["KeyA"] || keys["ArrowLeft"]) mx -= 1;
        if (keys["KeyD"] || keys["ArrowRight"]) mx += 1;

        if (joy.active) {
          mx += joy.dx;
          my += joy.dy;
        }
      }

      const mag = Math.hypot(mx, my);
      if (mag > 0.05) {
        const nx = mx / Math.max(1, mag);
        const ny = my / Math.max(1, mag);
        p.dirX = nx / Math.hypot(nx, ny);
        p.dirY = ny / Math.hypot(nx, ny);

        const sprinting = (keys["ShiftLeft"] || keys["ShiftRight"]) && p.stamina > 5;
        const speed = sprinting ? 114 : 78;
        if (sprinting) p.stamina = Math.max(0, p.stamina - dt * 26);
        else p.stamina = Math.min(p.maxStamina, p.stamina + dt * 16);

        moveWithCollision(p, nx * speed * dt, ny * speed * dt, 5, 5, true);
        p.walkAnim += dt * (sprinting ? 14 : 9);
      } else {
        p.stamina = Math.min(p.maxStamina, p.stamina + dt * 22);
      }

      // Healing Campfire Warmth
      if (!p.downed) {
        let nearFire = false;
        for (const n of state.nodes) {
          if (n.type === NODE_TYPE.CAMPFIRE && Math.hypot(n.tx * TILE_SIZE + 8 - p.x, n.ty * TILE_SIZE + 8 - p.y) < 34) {
            nearFire = true;
            break;
          }
        }
        if (!nearFire) {
          for (const st of state.structures.values()) {
            if (st.isCampfire && Math.hypot(st.tx * TILE_SIZE + 8 - p.x, st.ty * TILE_SIZE + 8 - p.y) < 34) {
              nearFire = true;
              break;
            }
          }
        }
        if (nearFire && p.hp < p.maxHp) {
          p.hp = Math.min(p.maxHp, p.hp + dt * 12);
        }
      }

      // Crystal Auto-Turrets
      for (const st of state.structures.values()) {
        if (!st.isTurret) continue;
        if (st.fireCooldown > 0) {
          st.fireCooldown -= dt;
          continue;
        }
        const tx = st.tx * TILE_SIZE + 8;
        const ty = st.ty * TILE_SIZE + 8;
        let closest = null, bestDist = 115;
        for (const e of state.enemies) {
          const d = Math.hypot(e.x - tx, e.y - ty);
          if (d < bestDist) {
            bestDist = d;
            closest = e;
          }
        }
        if (closest) {
          st.fireCooldown = 1.15;
          const ang = Math.atan2(closest.y - ty, closest.x - tx);
          state.projectiles.push({
            fromPlayer: true,
            kind: "turret_bolt",
            x: tx,
            y: ty,
            vx: Math.cos(ang) * 185,
            vy: Math.sin(ang) * 185,
            dmg: 18,
            life: 0.7,
            color: "#5ef7ff"
          });
        }
      }

      // Update Projectiles
      for (const proj of state.projectiles) {
        proj.x += proj.vx * dt;
        proj.y += proj.vy * dt;
        proj.life -= dt;

        const ptx = Math.floor(proj.x / TILE_SIZE);
        const pty = Math.floor(proj.y / TILE_SIZE);
        if (ptx < 0 || pty < 0 || ptx >= WORLD_W || pty >= WORLD_H) {
          proj.life = 0;
          continue;
        }
        const tile = state.tiles[pty][ptx];
        if (tile === TILE.CAVERN_WALL || tile === TILE.OBSIDIAN_WALL || tile === TILE.ROOT_GATE) {
          proj.life = 0;
          spawnParticles(proj.x, proj.y, proj.color, 4, 25);
          continue;
        }

        if (proj.fromPlayer) {
          for (const e of state.enemies) {
            if (e.hp <= 0) continue;
            if (proj.hitIds && proj.hitIds.has(e.id)) continue;
            const rad = e.isBoss ? 17 : 10;
            if (Math.hypot(e.x - proj.x, e.y - proj.y) <= rad) {
              const spd = Math.hypot(proj.vx, proj.vy) || 1;
              applyEnemyDamageLocal(e, proj.dmg, proj.vx / spd, proj.vy / spd, true);
              if (proj.pierce && proj.hitIds) {
                proj.hitIds.add(e.id);
              } else {
                proj.life = 0;
                break;
              }
            }
          }
        } else if (!p.downed && Math.hypot(p.x - proj.x, p.y - proj.y) <= 9) {
          damagePlayer(proj.dmg);
          proj.life = 0;
        }
      }
      state.projectiles = state.projectiles.filter(pr => pr.life > 0);
      state.enemies = state.enemies.filter(e => e.hp > 0);

      // Enemy & Root Warden Boss AI (Host or Solo runs authoritative AI)
      const isAuthoritative = (net.mode === "solo" || net.mode === "host");
      if (isAuthoritative) {
        // Build list of active hero targets (local + remote)
        const targets = [];
        if (!p.downed) targets.push(p);
        for (const rp of state.remotePlayers.values()) {
          if (!rp.downed && rp.hp > 0) targets.push(rp);
        }

        for (const e of state.enemies) {
          if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);

          // Find closest hero target
          let targetHero = p;
          let dist = Infinity;
          for (const tHero of targets) {
            const d = Math.hypot(tHero.x - e.x, tHero.y - e.y);
            if (d < dist) {
              dist = d;
              targetHero = tHero;
            }
          }

          if (e.isBoss) {
            if (e.hp < e.maxHp * 0.35) e.phase = 3;
            else if (e.hp < e.maxHp * 0.70) e.phase = 2;

            if (dist < e.aggro) {
              const ang = Math.atan2(targetHero.y - e.y, targetHero.x - e.x);
              const spd = e.speed + (e.phase - 1) * 11;
              moveWithCollision(e, Math.cos(ang) * spd * dt, Math.sin(ang) * spd * dt, 10, 10, false);

              e.attackTimer -= dt;
              if (e.attackTimer <= 0) {
                e.attackTimer = e.phase === 3 ? 1.35 : 1.9;
                const count = e.phase === 1 ? 5 : e.phase === 2 ? 8 : 12;
                sfx.play("roar");
                for (let i = 0; i < count; i++) {
                  const a = ang + (Math.PI * 2 * i) / count;
                  const bolt = {
                    fromPlayer: false,
                    kind: "root_orb",
                    x: e.x,
                    y: e.y,
                    vx: Math.cos(a) * 115,
                    vy: Math.sin(a) * 115,
                    dmg: 18,
                    life: 1.4,
                    color: "#4ff2ff"
                  };
                  state.projectiles.push(bolt);
                  net.broadcast({ type: "PROJECTILE_SPAWN", proj: bolt });
                }
              }

              if (Math.hypot(p.x - e.x, p.y - e.y) < 19) damagePlayer(e.dmg);
            }
            continue;
          }

          if (dist < e.aggro) {
            const ang = Math.atan2(targetHero.y - e.y, targetHero.x - e.x);
            moveWithCollision(e, Math.cos(ang) * e.speed * dt, Math.sin(ang) * e.speed * dt, 5, 5, false);
            if (Math.hypot(p.x - e.x, p.y - e.y) < 13) {
              damagePlayer(e.dmg);
            }
          } else {
            e.aiTimer -= dt;
            if (e.aiTimer <= 0) {
              e.aiTimer = 1.5 + Math.random() * 2;
              const a = Math.random() * Math.PI * 2;
              e.wanderX = Math.cos(a);
              e.wanderY = Math.sin(a);
            }
            if (Math.hypot(e.homeX - e.x, e.homeY - e.y) > 48) {
              const back = Math.atan2(e.homeY - e.y, e.homeX - e.x);
              e.wanderX = Math.cos(back);
              e.wanderY = Math.sin(back);
            }
            moveWithCollision(e, (e.wanderX || 0) * (e.speed * 0.35) * dt, (e.wanderY || 0) * (e.speed * 0.35) * dt, 5, 5, false);
          }
        }
      } else {
        for (const e of state.enemies) {
          if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);
        }
      }

      // Particles & Floating Text
      for (const pt of state.particles) {
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.life -= dt;
      }
      state.particles = state.particles.filter(pt => pt.life > 0);

      for (const ft of state.floatTexts) {
        ft.y -= 16 * dt;
        ft.life -= dt;
      }
      state.floatTexts = state.floatTexts.filter(ft => ft.life > 0);

      // Camera smooth follow
      const targetCamX = p.x - logicalW / 2;
      const targetCamY = p.y - logicalH / 2;
      const maxCamX = WORLD_W * TILE_SIZE - logicalW;
      const maxCamY = WORLD_H * TILE_SIZE - logicalH;
      state.camera.x = Math.max(0, Math.min(maxCamX, targetCamX));
      state.camera.y = Math.max(0, Math.min(maxCamY, targetCamY));
    }

    /* =========================================================================
       13. CRISP PIXEL RENDERING, DYNAMIC LIGHTING & CO-OP HUD
       ========================================================================= */
    function getNightAlpha() {
      const t = state.dayTime;
      if (t >= 0.22 && t <= 0.68) return 0.0;
      if (t > 0.68 && t < 0.78) return ((t - 0.68) / 0.10) * 0.66;
      if (t >= 0.78 || t <= 0.12) return 0.66;
      return ((0.22 - t) / 0.10) * 0.66;
    }

    function drawHeroCharacter(hero, isLocal, timeSec) {
      const sx = Math.round(hero.x - state.camera.x);
      const sy = Math.round(hero.y - state.camera.y);
      const bob = Math.sin(hero.walkAnim || 0) * 1.3;

      // Shadow
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.fillRect(sx - 5, sy + 5, 10, 3);

      if (hero.downed) {
        // Downed hero lying on ground with pulsing SOS cross
        ctx.fillStyle = hero.color || "#3d7bd9";
        ctx.fillRect(sx - 6, sy, 12, 5);
        ctx.fillStyle = "#f2c19b";
        ctx.fillRect(sx - 8, sy - 1, 4, 4);
        const pulse = Math.sin(timeSec * 8) > 0;
        ctx.fillStyle = pulse ? "#ff4757" : "#ffd452";
        ctx.fillRect(sx - 1, sy - 12, 2, 6);
        ctx.fillRect(sx - 3, sy - 10, 6, 2);
      } else {
        // Tunic / Armor
        ctx.fillStyle = hero.hasArmor ? "#8899b0" : (hero.color || "#3d7bd9");
        ctx.fillRect(sx - 4, sy - 2 + bob, 8, 7);

        // Head & Hair
        ctx.fillStyle = "#f2c19b";
        ctx.fillRect(sx - 4, sy - 8 + bob, 8, 6);
        ctx.fillStyle = "#5c3419";
        ctx.fillRect(sx - 4, sy - 9 + bob, 8, 2);

        // Eyes
        ctx.fillStyle = "#111";
        const eyeOffX = (hero.dirX || 0) >= 0 ? 1 : -2;
        ctx.fillRect(sx + eyeOffX, sy - 6 + bob, 1, 2);
        ctx.fillRect(sx + eyeOffX + 2, sy - 6 + bob, 1, 2);

        // Held Weapon / Tool
        const toolId = isLocal
          ? (state.hotbar[state.selectedSlot]?.id || "wood_axe")
          : (hero.toolId || "wood_axe");
        const toolColor = (ITEM_DEFS[toolId] || ITEM_DEFS.wood_axe).color;
        const swingAng = Math.atan2(hero.dirY || 0, hero.dirX || 1) + ((hero.attackAnim || 0) > 0 ? Math.sin(hero.attackAnim * 35) * 1.1 : 0);
        const wx = sx + Math.cos(swingAng) * 8;
        const wy = sy + Math.sin(swingAng) * 8;
        ctx.strokeStyle = toolColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(wx, wy);
        ctx.stroke();

        if ((hero.attackAnim || 0) > 0) {
          ctx.strokeStyle = "rgba(255,255,255,0.65)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(sx, sy, 14, swingAng - 0.7, swingAng + 0.7);
          ctx.stroke();
        }
      }

      // Nameplate & HP bar above remote teammates (and local name in co-op)
      if (!isLocal || net.mode !== "solo") {
        const label = hero.downed ? `${hero.name} [USE]` : hero.name;
        ctx.font = "bold 6px Inter, monospace";
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = "rgba(10,8,20,0.72)";
        ctx.fillRect(sx - tw / 2 - 2, sy - 20, tw + 4, 8);
        ctx.fillStyle = hero.downed ? "#ff6b81" : "#ffffff";
        ctx.fillText(label, sx - tw / 2, sy - 19);

        if (!isLocal) {
          ctx.fillStyle = "#1c172e";
          ctx.fillRect(sx - 8, sy - 11, 16, 2);
          ctx.fillStyle = "#4fff88";
          ctx.fillRect(sx - 8, sy - 11, Math.round(16 * Math.max(0, hero.hp / Math.max(1, hero.maxHp))), 2);
        }
      }

      // Quick Chat Speech Bubble above head
      if ((hero.emoteTimer || 0) > 0 && hero.emoteText) {
        ctx.font = "bold 7px Inter, monospace";
        const bw = ctx.measureText(hero.emoteText).width + 8;
        const bx = Math.round(sx - bw / 2);
        const by = sy - 33;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(bx, by, bw, 11);
        ctx.strokeStyle = "#181329";
        ctx.lineWidth = 1;
        ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, 10);
        ctx.fillStyle = "#141024";
        ctx.fillText(hero.emoteText, bx + 4, by + 2);
      }
    }

    function renderWorld() {
      const shakeX = state.shake > 0 ? (Math.random() - 0.5) * state.shake : 0;
      const shakeY = state.shake > 0 ? (Math.random() - 0.5) * state.shake : 0;
      const camX = Math.floor(state.camera.x + shakeX);
      const camY = Math.floor(state.camera.y + shakeY);

      const startTx = Math.max(0, Math.floor(camX / TILE_SIZE));
      const startTy = Math.max(0, Math.floor(camY / TILE_SIZE));
      const endTx = Math.min(WORLD_W - 1, Math.ceil((camX + logicalW) / TILE_SIZE));
      const endTy = Math.min(WORLD_H - 1, Math.ceil((camY + logicalH) / TILE_SIZE));

      const timeSec = performance.now() * 0.001;

      for (let ty = startTy; ty <= endTy; ty++) {
        for (let tx = startTx; tx <= endTx; tx++) {
          const sx = tx * TILE_SIZE - camX;
          const sy = ty * TILE_SIZE - camY;
          const t = state.tiles[ty][tx];
          const alt = (tx + ty) & 1;

          let spr = SPRITES.grass0;
          if (t === TILE.GRASS) spr = alt ? SPRITES.grass1 : SPRITES.grass0;
          else if (t === TILE.FOREST_GRASS) spr = alt ? SPRITES.fgrass1 : SPRITES.fgrass0;
          else if (t === TILE.PATH) spr = SPRITES.path;
          else if (t === TILE.CAVERN_FLOOR) spr = SPRITES.cavern_floor;
          else if (t === TILE.SANCTUM_FLOOR) spr = SPRITES.sanctum_floor;
          else if (t === TILE.CAVERN_WALL) spr = SPRITES.cavern_wall;
          else if (t === TILE.ASH_FLOOR) spr = SPRITES.ash_floor;
          else if (t === TILE.OBSIDIAN_WALL) spr = SPRITES.obsidian_wall;
          else if (t === TILE.WATER) spr = SPRITES.water;
          else if (t === TILE.LAVA) spr = SPRITES.lava;
          else if (t === TILE.FENCE) spr = SPRITES.fence;
          else if (t === TILE.ROOT_GATE) spr = SPRITES.root_gate;
          else if (t === TILE.ROOT_GATE_OPEN) spr = SPRITES.root_gate_open;

          ctx.drawImage(spr, sx, sy);

          if (t === TILE.WATER && ((tx + Math.floor(timeSec * 2)) % 3 === 0)) {
            ctx.fillStyle = "rgba(150, 215, 255, 0.35)";
            ctx.fillRect(sx + 4, sy + 6, 4, 1);
          } else if (t === TILE.LAVA && ((ty + Math.floor(timeSec * 3)) % 2 === 0)) {
            ctx.fillStyle = "rgba(255, 235, 110, 0.45)";
            ctx.fillRect(sx + 5, sy + 5, 4, 2);
          }
        }
      }

      const p = state.player;
      for (const st of state.structures.values()) {
        if (st.tx < startTx - 1 || st.tx > endTx + 1 || st.ty < startTy - 1 || st.ty > endTy + 1) continue;
        const sx = st.tx * TILE_SIZE - camX;
        const sy = st.ty * TILE_SIZE - camY;

        if (st.id === "floor") ctx.drawImage(SPRITES.b_floor, sx, sy);
        else if (st.id === "wwall") ctx.drawImage(SPRITES.b_wwall, sx, sy);
        else if (st.id === "swall") ctx.drawImage(SPRITES.b_swall, sx, sy);
        else if (st.id === "door") {
          let nearAnyHero = Math.hypot(p.x - (st.tx * TILE_SIZE + 8), p.y - (st.ty * TILE_SIZE + 8)) < 24;
          if (!nearAnyHero) {
            for (const rp of state.remotePlayers.values()) {
              if (Math.hypot(rp.x - (st.tx * TILE_SIZE + 8), rp.y - (st.ty * TILE_SIZE + 8)) < 24) {
                nearAnyHero = true;
                break;
              }
            }
          }
          ctx.drawImage(nearAnyHero ? SPRITES.b_door_open : SPRITES.b_door_closed, sx, sy);
        } else if (st.id === "torch") {
          ctx.drawImage(SPRITES.b_floor, sx, sy);
          ctx.drawImage(SPRITES.b_torch, sx, sy);
        } else if (st.id === "campfire") {
          ctx.drawImage(SPRITES.b_floor, sx, sy);
          drawCampfireSprite(sx, sy, timeSec);
        } else if (st.id === "bed") {
          ctx.drawImage(SPRITES.b_floor, sx, sy);
          ctx.drawImage(SPRITES.b_bed, sx, sy);
        } else if (st.id === "turret") {
          ctx.drawImage(SPRITES.b_turret, sx, sy);
        }
      }

      for (const n of state.nodes) {
        if (n.tx < startTx - 2 || n.tx > endTx + 2 || n.ty < startTy - 2 || n.ty > endTy + 2) continue;
        const sx = n.tx * TILE_SIZE - camX;
        const sy = n.ty * TILE_SIZE - camY;

        if (n.type === NODE_TYPE.TREE) {
          ctx.drawImage(SPRITES.tree, sx, sy - 6);
        } else if (n.type === NODE_TYPE.CAMPFIRE) {
          drawCampfireSprite(sx, sy, timeSec);
        } else if (n.type === NODE_TYPE.CHEST) {
          ctx.drawImage(n.opened ? SPRITES.chest_open : SPRITES.chest, sx, sy);
        } else {
          ctx.drawImage(SPRITES[n.type], sx, sy);
        }
      }

      // Blacksmith Bran NPC
      const npcX = Math.round(state.npc.x - camX - 8);
      const npcY = Math.round(state.npc.y - camY - 8);
      ctx.drawImage(SPRITES.blacksmith, npcX, npcY);
      if (!p.talkedToBran) {
        const bounce = Math.sin(timeSec * 5) * 1.5;
        ctx.fillStyle = "#ffd43b";
        ctx.fillRect(npcX + 7, npcY - 8 + bounce, 2, 4);
        ctx.fillRect(npcX + 7, npcY - 3 + bounce, 2, 1);
      }

      // Enemies & Boss
      for (const e of state.enemies) {
        const sx = Math.round(e.x - camX);
        const sy = Math.round(e.y - camY);
        if (sx < -32 || sy < -32 || sx > logicalW + 32 || sy > logicalH + 32) continue;

        if (e.isBoss) {
          ctx.drawImage(SPRITES.boss, sx - 16, sy - 16);
          ctx.fillStyle = "#1a1118";
          ctx.fillRect(sx - 20, sy - 23, 40, 4);
          ctx.fillStyle = e.phase === 3 ? "#ff3b5c" : e.phase === 2 ? "#ff9933" : "#4ff2ff";
          ctx.fillRect(sx - 19, sy - 22, Math.max(0, Math.round(38 * (e.hp / e.maxHp))), 2);
        } else {
          ctx.drawImage(SPRITES[e.kind], sx - 8, sy - 8);
          if (e.hp < e.maxHp) {
            ctx.fillStyle = "#1a1118";
            ctx.fillRect(sx - 7, sy - 12, 14, 3);
            ctx.fillStyle = "#ff4d6d";
            ctx.fillRect(sx - 6, sy - 11, Math.max(0, Math.round(12 * (e.hp / e.maxHp))), 1);
          }
        }
      }

      // Render Remote Teammates
      for (const rp of state.remotePlayers.values()) {
        drawHeroCharacter(rp, false, timeSec);
      }

      // Render Local Player
      drawHeroCharacter(p, true, timeSec);

      // Projectiles
      for (const pr of state.projectiles) {
        const sx = Math.round(pr.x - camX);
        const sy = Math.round(pr.y - camY);
        ctx.fillStyle = pr.color;
        if (pr.kind === "ember_wave") {
          ctx.fillRect(sx - 4, sy - 4, 8, 8);
          ctx.fillStyle = "#fff3b0";
          ctx.fillRect(sx - 2, sy - 2, 4, 4);
        } else {
          ctx.fillRect(sx - 2, sy - 2, 4, 4);
        }
      }

      // Build Mode Ghost Tile Preview
      if (state.buildMode && state.screen === "playing") {
        const target = getBuildTargetTile();
        const gx = target.tx * TILE_SIZE - camX;
        const gy = target.ty * TILE_SIZE - camY;
        const def = BUILD_DEFS[state.selectedBuildIdx];
        const valid = state.demolishMode
          ? state.structures.has(keyFor(target.tx, target.ty))
          : (canPlaceStructureAt(target.tx, target.ty, def) && hasResources(def.cost));

        ctx.strokeStyle = state.demolishMode ? "#ff5566" : valid ? "#5eff8c" : "#ffaa33";
        ctx.lineWidth = 1;
        ctx.strokeRect(gx + 0.5, gy + 0.5, TILE_SIZE - 1, TILE_SIZE - 1);
      }

      // Particles & Floating Numbers
      for (const pt of state.particles) {
        ctx.fillStyle = pt.color;
        ctx.fillRect(Math.round(pt.x - camX), Math.round(pt.y - camY), pt.size, pt.size);
      }

      ctx.font = "bold 7px Inter, monospace";
      for (const ft of state.floatTexts) {
        const fx = Math.round(ft.x - camX - 16);
        const fy = Math.round(ft.y - camY);
        ctx.fillStyle = "#08060f";
        ctx.fillText(ft.text, fx + 1, fy + 1);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, fx, fy);
      }

      // Dynamic Day/Night Lighting
      const nightAlpha = getNightAlpha();
      if (nightAlpha > 0.02) {
        lightCtx.globalCompositeOperation = "source-over";
        lightCtx.fillStyle = `rgba(8, 10, 26, ${nightAlpha.toFixed(3)})`;
        lightCtx.fillRect(0, 0, logicalW, logicalH);

        lightCtx.globalCompositeOperation = "destination-out";
        const punchLight = (wx, wy, rad) => {
          const lx = wx - camX;
          const ly = wy - camY;
          if (lx < -rad || ly < -rad || lx > logicalW + rad || ly > logicalH + rad) return;
          const grad = lightCtx.createRadialGradient(lx, ly, 4, lx, ly, rad);
          grad.addColorStop(0, "rgba(0,0,0,1)");
          grad.addColorStop(1, "rgba(0,0,0,0)");
          lightCtx.fillStyle = grad;
          lightCtx.beginPath();
          lightCtx.arc(lx, ly, rad, 0, Math.PI * 2);
          lightCtx.fill();
        };

        punchLight(p.x, p.y, 78);
        for (const rp of state.remotePlayers.values()) {
          punchLight(rp.x, rp.y, 78);
        }
        for (const n of state.nodes) {
          if (n.light) punchLight(n.tx * TILE_SIZE + 8, n.ty * TILE_SIZE + 8, n.light);
        }
        for (const st of state.structures.values()) {
          if (st.light) punchLight(st.tx * TILE_SIZE + 8, st.ty * TILE_SIZE + 8, st.light);
        }

        ctx.drawImage(lightCanvas, 0, 0);
      }
    }

    function drawCampfireSprite(sx, sy, timeSec) {
      px(ctx, sx + 3, sy + 11, 10, 3, "#5c361a");
      px(ctx, sx + 5, sy + 10, 6, 3, "#7a4924");
      const flicker = Math.sin(timeSec * 14) > 0;
      px(ctx, sx + 5, sy + 5, 6, 6, "#ff6a1c");
      px(ctx, sx + 6, sy + (flicker ? 3 : 4), 4, 6, "#ffd43b");
      px(ctx, sx + 7, sy + 6, 2, 3, "#ffffff");
    }

    function getCurrentObjective() {
      if (state.player.downed) return "DOWNED! Wait for teammate to press USE";
      if (!state.player.talkedToBran) return "Speak with Blacksmith Bran [USE]";
      if (!playerHasItem("crystal_blade") && !playerHasItem("ember_sword")) {
        return "Mine Crystals in East Caverns & craft Crystal Blade";
      }
      if (!state.gateUnlocked) return "Unlock Pulse Caverns Root Gate [USE]";
      if (!state.bossDefeated) return "Defeat the Root Warden Boss in Sanctum!";
      return "Explore Ashen Wastes & expand your Homestead!";
    }

    function drawHUD() {
      const p = state.player;

      // Top-Left Status Panel
      ctx.fillStyle = "rgba(12, 10, 22, 0.84)";
      ctx.fillRect(6, 6, 129, 32);
      ctx.strokeStyle = "#483f6b";
      ctx.lineWidth = 1;
      ctx.strokeRect(6.5, 6.5, 128, 31);

      // HP Bar
      ctx.fillStyle = "#261824";
      ctx.fillRect(10, 10, 68, 6);
      ctx.fillStyle = "#ff4466";
      ctx.fillRect(10, 10, Math.round(68 * (p.hp / p.maxHp)), 6);
      ctx.font = "bold 6px Inter, monospace";
      ctx.fillStyle = "#ffffff";
      ctx.fillText(`HP ${Math.ceil(p.hp)}/${p.maxHp}`, 12, 10);

      // Stamina Bar
      ctx.fillStyle = "#162426";
      ctx.fillRect(10, 18, 68, 4);
      ctx.fillStyle = "#47e89d";
      ctx.fillRect(10, 18, Math.round(68 * (p.stamina / p.maxStamina)), 4);

      // Day/Night & Room Badge
      const isNight = getNightAlpha() > 0.25;
      ctx.fillStyle = isNight ? "#8cb4ff" : "#ffd452";
      ctx.fillText(`DAY ${state.dayCount} ${isNight ? "NIGHT" : "DAY"}`, 82, 10);

      if (net.mode !== "solo") {
        ctx.fillStyle = "#6ef7ff";
        ctx.fillText(net.roomCode, 82, 18);
      }

      // Current Objective
      ctx.fillStyle = "#d9d4eb";
      ctx.fillText(getCurrentObjective().slice(0, 31), 10, 26);
      const challenge = state.challenge;
      if (challenge) {
        ctx.font = "bold 6px Inter, monospace";
        ctx.fillStyle = challenge.claimed ? "#7aff9e" : "#ffd98a";
        const challengeLabel = `DAY QUEST ${challenge.progress}/${challenge.target} ${challenge.claimed ? "✓" : ""}`;
        ctx.fillText(`${challengeLabel} ${challenge.label.slice(0, 22)}`, 10, 33);
      }

      // Top Utility Pills
      for (const pill of getTopBarPills()) {
        ctx.fillStyle = "rgba(22, 18, 38, 0.88)";
        ctx.fillRect(pill.x, pill.y, pill.w, pill.h);
        ctx.strokeStyle = "#5c5285";
        ctx.strokeRect(pill.x + 0.5, pill.y + 0.5, pill.w - 1, pill.h - 1);
        ctx.fillStyle = "#e8e3ff";
        ctx.fillText(pill.label, pill.x + 3, pill.y + 4);
      }

      // Top-Right Minimap
      const mm = getMinimapRect();
      ctx.fillStyle = "rgba(10, 9, 18, 0.9)";
      ctx.fillRect(mm.x - 1, mm.y - 1, mm.w + 2, mm.h + 2);
      ctx.strokeStyle = "#5d5387";
      ctx.strokeRect(mm.x - 0.5, mm.y - 0.5, mm.w + 1, mm.h + 1);

      const scaleX = mm.w / WORLD_W;
      const scaleY = mm.h / WORLD_H;
      for (let ty = 0; ty < WORLD_H; ty += 2) {
        for (let tx = 0; tx < WORLD_W; tx += 2) {
          const b = state.biomes[ty][tx];
          const t = state.tiles[ty][tx];
          ctx.fillStyle =
            t === TILE.WATER ? "#2b6cb0" :
            t === TILE.LAVA ? "#e04f1a" :
            b === BIOME.VILLAGE ? "#3b7a4d" :
            b === BIOME.FOREST ? "#24573b" :
            b === BIOME.CAVERNS ? "#3a3f54" : "#4a3235";
          ctx.fillRect(
            Math.floor(mm.x + tx * scaleX),
            Math.floor(mm.y + ty * scaleY),
            Math.ceil(scaleX * 2),
            Math.ceil(scaleY * 2)
          );
        }
      }

      // Remote Teammates on Minimap
      for (const rp of state.remotePlayers.values()) {
        ctx.fillStyle = rp.color || "#5ceeff";
        ctx.fillRect(Math.floor(mm.x + (rp.x / TILE_SIZE) * scaleX) - 1, Math.floor(mm.y + (rp.y / TILE_SIZE) * scaleY) - 1, 3, 3);
      }

      // Local Player dot on Minimap
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(
        Math.floor(mm.x + (p.x / TILE_SIZE) * scaleX) - 1,
        Math.floor(mm.y + (p.y / TILE_SIZE) * scaleY) - 1,
        3,
        3
      );

      // Compact Resource Strip below Minimap
      const resItems = [
        ["WD", state.resources.wood, "#cfa063"],
        ["ST", state.resources.stone, "#b8c4d9"],
        ["HB", state.resources.herb, "#6bff95"],
        ["IR", state.resources.iron, "#f5ba84"],
        ["CR", state.resources.crystal, "#6ef7ff"],
        ["CL", state.resources.coal, "#a8a3ba"],
        ["EM", state.resources.ember, "#ff8b33"]
      ];
      const resBoxW = 76;
      const resBoxX = logicalW - resBoxW - 6;
      const resBoxY = mm.y + mm.h + 4;
      ctx.fillStyle = "rgba(12, 10, 22, 0.84)";
      ctx.fillRect(resBoxX, resBoxY, resBoxW, 24);
      ctx.strokeStyle = "#483f6b";
      ctx.strokeRect(resBoxX + 0.5, resBoxY + 0.5, resBoxW - 1, 23);

      resItems.forEach(([tag, val, col], idx) => {
        const colIdx = idx % 4;
        const rowIdx = Math.floor(idx / 4);
        const rx = resBoxX + 3 + colIdx * 18;
        const ry = resBoxY + 3 + rowIdx * 10;
        ctx.fillStyle = col;
        ctx.fillText(`${tag}${val}`, rx, ry);
      });

      // Toast Notification Banner
      if (state.toastTimer > 0 && state.toastText) {
        ctx.font = "bold 7px Inter, monospace";
        const tw = ctx.measureText(state.toastText).width + 12;
        const tx = Math.floor((logicalW - tw) / 2);
        ctx.fillStyle = "rgba(14, 11, 28, 0.92)";
        ctx.fillRect(tx, 58, tw, 14);
        ctx.strokeStyle = "#ffd452";
        ctx.strokeRect(tx + 0.5, 58.5, tw - 1, 13);
        ctx.fillStyle = "#fff5d6";
        ctx.fillText(state.toastText, tx + 6, 61);
      }

      // Quick Chat Selector Popup
      if (state.quickChatOpen) {
        for (const q of getQuickChatRects()) {
          ctx.fillStyle = "rgba(22, 18, 42, 0.95)";
          ctx.fillRect(q.x, q.y, q.w, q.h);
          ctx.strokeStyle = "#cbb5ff";
          ctx.strokeRect(q.x + 0.5, q.y + 0.5, q.w - 1, q.h - 1);
          ctx.fillStyle = "#ffffff";
          ctx.fillText(q.text, q.x + 5, q.y + 5);
        }
      }

      // Build Mode Palette
      if (state.buildMode) {
        const pRects = getBuildPaletteRects();
        for (const pr of pRects) {
          const isSel = pr.item.id === "demolish"
            ? state.demolishMode
            : (!state.demolishMode && pr.idx === state.selectedBuildIdx);
          ctx.fillStyle = isSel ? "rgba(65, 52, 112, 0.95)" : "rgba(14, 12, 26, 0.9)";
          ctx.fillRect(pr.x, pr.y, pr.w, pr.h);
          ctx.strokeStyle = isSel ? "#ffd452" : "#4b4270";
          ctx.strokeRect(pr.x + 0.5, pr.y + 0.5, pr.w - 1, pr.h - 1);
          ctx.fillStyle = pr.item.id === "demolish" ? "#ff7b8a" : "#f3efe6";
          ctx.fillText(pr.item.short, pr.x + 3, pr.y + 5);
        }
      }

      // Bottom-Center 5-Slot Hotbar
      const hRects = getHotbarRects();
      for (const hr of hRects) {
        const selected = !state.buildMode && hr.index === state.selectedSlot;
        ctx.fillStyle = selected ? "rgba(52, 42, 92, 0.95)" : "rgba(14, 12, 26, 0.9)";
        ctx.fillRect(hr.x, hr.y, hr.w, hr.h);
        ctx.strokeStyle = selected ? "#ffd452" : "#4c4373";
        ctx.strokeRect(hr.x + 0.5, hr.y + 0.5, hr.w - 1, hr.h - 1);

        const slot = state.hotbar[hr.index];
        if (slot) {
          const def = ITEM_DEFS[slot.id];
          ctx.fillStyle = def.color;
          ctx.fillRect(hr.x + 6, hr.y + 6, 9, 9);
          if (slot.count > 1) {
            ctx.fillStyle = "#ffffff";
            ctx.fillText(String(slot.count), hr.x + 13, hr.y + 13);
          }
        }
        ctx.fillStyle = "#9d94bd";
        ctx.fillText(String(hr.index + 1), hr.x + 2, hr.y + 2);
      }

      // Touch Controls (Joystick + Tactile Buttons)
      if (showTouchControls) {
        const jx = joy.active ? joy.baseX : 42;
        const jy = joy.active ? joy.baseY : logicalH - 42;
        ctx.strokeStyle = "rgba(255,255,255,0.28)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(jx, jy, 24, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = "rgba(255,255,255,0.42)";
        ctx.beginPath();
        ctx.arc(joy.active ? joy.knobX : jx, joy.active ? joy.knobY : jy, 10, 0, Math.PI * 2);
        ctx.fill();

        for (const btn of getTouchButtons()) {
          ctx.fillStyle = btn.bg;
          ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
          ctx.strokeStyle = btn.border;
          ctx.lineWidth = 1;
          ctx.strokeRect(btn.x + 0.5, btn.y + 0.5, btn.w - 1, btn.h - 1);
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 7px Inter, monospace";
          const lw = ctx.measureText(btn.label).width;
          ctx.fillText(btn.label, Math.floor(btn.x + (btn.w - lw) / 2), Math.floor(btn.y + (btn.h - 7) / 2));
        }
      }
    }

    function drawModalsAndScreens() {
      if (state.screen === "title") return;

      if (state.screen === "gameover") {
        ctx.fillStyle = "rgba(18, 4, 8, 0.82)";
        ctx.fillRect(0, 0, logicalW, logicalH);
        ctx.font = "bold 16px Inter, monospace";
        ctx.fillStyle = "#ff4d6d";
        const t = "YOU FELL IN THE VEIL";
        ctx.fillText(t, Math.floor((logicalW - ctx.measureText(t).width) / 2), Math.floor(logicalH / 2) - 24);
        ctx.font = "bold 8px Inter, monospace";
        ctx.fillStyle = "#f3efe6";
        const sub = "Tap anywhere or press [R] to Respawn at your Bed / Camp";
        ctx.fillText(sub, Math.floor((logicalW - ctx.measureText(sub).width) / 2), Math.floor(logicalH / 2) + 4);
        return;
      }

      if (state.screen === "victory") {
        ctx.fillStyle = "rgba(10, 18, 28, 0.85)";
        ctx.fillRect(0, 0, logicalW, logicalH);
        ctx.font = "bold 15px Inter, monospace";
        ctx.fillStyle = "#ffd452";
        const t = "ROOT WARDEN VANQUISHED!";
        ctx.fillText(t, Math.floor((logicalW - ctx.measureText(t).width) / 2), Math.floor(logicalH / 2) - 26);
        ctx.font = "bold 8px Inter, monospace";
        ctx.fillStyle = "#78f0ff";
        const sub = "Pulse Caverns are freed! Tap or press [SPACE] to keep exploring.";
        ctx.fillText(sub, Math.floor((logicalW - ctx.measureText(sub).width) / 2), Math.floor(logicalH / 2) + 4);
        return;
      }

      if (state.modal === "crafting") {
        const { bx, by, boxW, boxH, rows } = getCraftingCardRects();
        ctx.fillStyle = "rgba(12, 10, 24, 0.96)";
        ctx.fillRect(bx, by, boxW, boxH);
        ctx.strokeStyle = "#6e61a3";
        ctx.lineWidth = 1;
        ctx.strokeRect(bx + 0.5, by + 0.5, boxW - 1, boxH - 1);

        ctx.font = "bold 8px Inter, monospace";
        ctx.fillStyle = "#ffd452";
        ctx.fillText("CRAFTING & BLUEPRINTS (Tap row to craft)", bx + 10, by + 7);

        ctx.font = "bold 6px Inter, monospace";
        for (const r of rows) {
          const can = hasResources(r.recipe.cost);
          ctx.fillStyle = can ? "rgba(38, 68, 56, 0.9)" : "rgba(28, 24, 44, 0.85)";
          ctx.fillRect(r.x, r.y, r.w, r.h);
          ctx.strokeStyle = can ? "#5eff8c" : "#443c66";
          ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);

          ctx.fillStyle = can ? "#ffffff" : "#9c94bd";
          ctx.fillText(r.recipe.name, r.x + 5, r.y + 3);

          const costStr = Object.entries(r.recipe.cost)
            .map(([k, v]) => `${v}${k.slice(0, 2).toUpperCase()}`)
            .join(" ");
          ctx.fillStyle = can ? "#ffd452" : "#787096";
          const cw = ctx.measureText(costStr).width;
          ctx.fillText(costStr, r.x + r.w - cw - 6, r.y + 3);
        }

        ctx.fillStyle = "#b4abd6";
        ctx.fillText("Tap outside or press [C] / [ESC] to close", bx + 10, by + boxH - 11);
      } else if (state.modal === "dialogue") {
        const bw = Math.min(logicalW - 24, 340);
        const bh = 68;
        const bx = Math.floor((logicalW - bw) / 2);
        const by = logicalH - bh - 34;
        ctx.fillStyle = "rgba(12, 10, 24, 0.96)";
        ctx.fillRect(bx, by, bw, bh);
        ctx.strokeStyle = "#ffd452";
        ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);

        ctx.font = "bold 7px Inter, monospace";
        ctx.fillStyle = "#f3efe6";
        const words = state.dialogueText.split(" ");
        let line = "", ly = by + 8;
        for (const w of words) {
          const test = line + w + " ";
          if (ctx.measureText(test).width > bw - 16) {
            ctx.fillText(line, bx + 8, ly);
            line = w + " ";
            ly += 10;
          } else {
            line = test;
          }
        }
        ctx.fillText(line, bx + 8, ly);
        ctx.fillStyle = "#78f0ff";
        ctx.fillText("[Tap or press E to continue]", bx + 8, by + bh - 12);
      } else if (state.modal === "map") {
        const mw = Math.min(logicalW - 24, 300);
        const mh = Math.min(logicalH - 24, 190);
        const mx = Math.floor((logicalW - mw) / 2);
        const my = Math.floor((logicalH - mh) / 2);
        ctx.fillStyle = "rgba(10, 9, 20, 0.96)";
        ctx.fillRect(mx - 4, my - 14, mw + 8, mh + 26);
        ctx.strokeStyle = "#ffd452";
        ctx.strokeRect(mx - 3.5, my - 13.5, mw + 7, mh + 25);

        ctx.font = "bold 7px Inter, monospace";
        ctx.fillStyle = "#ffd452";
        ctx.fillText("EMBERVEIL WORLD MAP (Tap or [M] to close)", mx, my - 10);

        const sx = mw / WORLD_W;
        const sy = mh / WORLD_H;
        for (let ty = 0; ty < WORLD_H; ty++) {
          for (let tx = 0; tx < WORLD_W; tx++) {
            const b = state.biomes[ty][tx];
            const t = state.tiles[ty][tx];
            ctx.fillStyle =
              t === TILE.WATER ? "#2b6cb0" :
              t === TILE.LAVA ? "#e04f1a" :
              t === TILE.ROOT_GATE ? "#4ff2ff" :
              b === BIOME.VILLAGE ? "#3b7a4d" :
              b === BIOME.FOREST ? "#24573b" :
              b === BIOME.CAVERNS ? "#3a3f54" : "#4a3235";
            ctx.fillRect(Math.floor(mx + tx * sx), Math.floor(my + ty * sy), Math.ceil(sx), Math.ceil(sy));
          }
        }

        // Player & Ally markers
        const pxPos = Math.floor(mx + (state.player.x / TILE_SIZE) * sx);
        const pyPos = Math.floor(my + (state.player.y / TILE_SIZE) * sy);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(pxPos - 2, pyPos - 2, 4, 4);

        for (const rp of state.remotePlayers.values()) {
          ctx.fillStyle = rp.color || "#5ceeff";
          ctx.fillRect(Math.floor(mx + (rp.x / TILE_SIZE) * sx) - 2, Math.floor(my + (rp.y / TILE_SIZE) * sy) - 2, 4, 4);
        }

        ctx.fillStyle = "#d9d4eb";
        ctx.fillText("West: Village | North: Forest | East: Caverns & Boss | Far East: Wastes", mx, my + mh + 3);
      } else if (state.modal === "pause") {
        ctx.fillStyle = "rgba(8, 6, 16, 0.82)";
        ctx.fillRect(0, 0, logicalW, logicalH);
        const bw = 150, bh = 22;
        const bx = Math.floor((logicalW - bw) / 2);
        const by = Math.floor(logicalH / 2) - 24;

        const opts = ["RESUME GAME", "SAVE PROGRESS", "QUIT TO TITLE"];
        opts.forEach((lbl, idx) => {
          const oy = by + idx * 28;
          ctx.fillStyle = "#1f1a36";
          ctx.fillRect(bx, oy, bw, bh);
          ctx.strokeStyle = "#78f0ff";
          ctx.strokeRect(bx + 0.5, oy + 0.5, bw - 1, bh - 1);
          ctx.font = "bold 8px Inter, monospace";
          ctx.fillStyle = "#ffffff";
          ctx.fillText(lbl, Math.floor(bx + (bw - ctx.measureText(lbl).width) / 2), oy + 7);
        });
      }
    }

    /* =========================================================================
       14. BOOTSTRAP & ANIMATION LOOP
       ========================================================================= */
    generateWorld(133742);
    state.camera.x = 12 * TILE_SIZE;
    state.camera.y = 33 * TILE_SIZE;

    let lastTime = 0;
    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min(0.05, Math.max(0.001, (timestamp - lastTime) / 1000));
      lastTime = timestamp;

      enforceContextState();
      updateSimulation(dt);
      renderWorld();
      if (state.screen !== "title") drawHUD();
      drawModalsAndScreens();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("load", () => {
      resizeCanvas();
      requestAnimationFrame(gameLoop);
    });
  </script>
</body>
</html>
